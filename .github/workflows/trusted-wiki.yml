name: trusted-wiki

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  lint:
    # Proof: gate-entrypoints.test.ts requires this job to have no variable-gated `if`; with all
    # three variables absent the live pull_request_target job reaches the `:?` guards below and
    # fails instead of reporting a green skipped admission check.
    runs-on: ubuntu-latest
    steps:
      - name: Require immutable activation configuration
        env:
          ACTIVATION_ARCHIVE_SHA256: ${{ vars.TOOL_WIKI_ACTIVATION_ARCHIVE_SHA256 }}
          ACTIVATION_ARCHIVE_URL: ${{ vars.TOOL_WIKI_ACTIVATION_ARCHIVE_URL }}
          ACTIVATION_VERSION: ${{ vars.TOOL_WIKI_ACTIVATION_VERSION }}
        run: |
          set -euo pipefail
          : "${ACTIVATION_ARCHIVE_SHA256:?trusted activation archive digest is not configured}"
          : "${ACTIVATION_ARCHIVE_URL:?trusted activation archive URL is not configured}"
          : "${ACTIVATION_VERSION:?trusted activation version is not configured}"
          # Proof: gate-entrypoints.test.ts executes this production block with `main` and
          # observes exit 78 before the mutable ref can supply the trusted launcher or runtime.
          [[ "$ACTIVATION_VERSION" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'activation version must be a full commit SHA\n' >&2
            exit 78
          }

      - name: Check out trusted launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Repository variables are target-context authority. Pin both launcher and runtime
          # modules to the same reviewed source revision that produced the activation archive.
          ref: ${{ vars.TOOL_WIKI_ACTIVATION_VERSION }}
          path: trusted
          persist-credentials: false

      - name: Preserve trusted launcher
        run: install -m 0555 trusted/bin/tool-wiki-lint.sh "$RUNNER_TEMP/tool-wiki-lint.sh"

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install trusted validator runtime modules
        working-directory: trusted
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Provision immutable external activation
        env:
          ACTIVATION_ARCHIVE_SHA256: ${{ vars.TOOL_WIKI_ACTIVATION_ARCHIVE_SHA256 }}
          ACTIVATION_ARCHIVE_URL: ${{ vars.TOOL_WIKI_ACTIVATION_ARCHIVE_URL }}
          ACTIVATION_VERSION: ${{ vars.TOOL_WIKI_ACTIVATION_VERSION }}
        run: |
          set -euo pipefail
          : "${ACTIVATION_ARCHIVE_SHA256:?trusted activation archive digest is not configured}"
          : "${ACTIVATION_ARCHIVE_URL:?trusted activation archive URL is not configured}"
          : "${ACTIVATION_VERSION:?trusted activation version is not configured}"
          archive="$RUNNER_TEMP/tool-wiki-activation.tar"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$ACTIVATION_ARCHIVE_URL"
          printf '%s  %s\n' "$ACTIVATION_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          activation_root="$RUNNER_TEMP/tool-wiki-activation/$ACTIVATION_VERSION"
          mkdir -m 0700 -p "$activation_root"
          tar --extract --file "$archive" --directory "$activation_root" --no-same-owner --no-same-permissions
          test -s "$activation_root/selected.json"
          printf 'TOOL_WIKI_ACTIVATION_ROOT=%s\n' "$activation_root" >> "$GITHUB_ENV"

      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      # This target-context job runs only the launcher preserved from the operator-pinned
      # activation-version revision.
      # The launcher runs its externally activated validator with an empty environment and
      # treats candidate bytes solely as the immutable committed selection being inspected.
      # Proof: gate-entrypoints.test.ts replaces both candidate scripts with exit 0 and the
      # preserved production launcher still rejects the stale application obligation.
      - name: Verify exact candidate with external trust
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TOOL_WIKI_REQUIRE_CERTIFIED: '1'
          TOOL_WIKI_TRUSTED_NODE_MODULES: ${{ github.workspace }}/trusted/node_modules
        run: bash "$RUNNER_TEMP/tool-wiki-lint.sh" committed "$GITHUB_WORKSPACE/candidate" "$CANDIDATE_SHA"
