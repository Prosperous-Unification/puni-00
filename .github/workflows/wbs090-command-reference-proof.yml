name: wbs090-command-reference-proof

on:
  push:
    branches: [proof/wbs090-command-references-20261016]

permissions:
  contents: read
  actions: read

concurrency:
  group: wbs090-command-reference-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e22e55f615be361551519cd9dd7ffdf40da7e326
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Prove cleanup with missing tools and failed swapoff
        working-directory: proof
        run: bun test openspec/changes/wbs-burokrat-evaluation/evidence/command-reference-hosted-proof/cleanup.test.mjs
      - name: Pin exact sources and reserve ephemeral runner swap
        shell: bash
        run: |
          set -euo pipefail
          python3 proof/openspec/changes/wbs-burokrat-evaluation/evidence/command-reference-hosted-proof/prove.py prepare
          df -h > receipts/disk-before.txt
          sudo fallocate -l 12G /mnt/wbs090-command-reference-proof.swap
          sudo chmod 600 /mnt/wbs090-command-reference-proof.swap
          sudo mkswap /mnt/wbs090-command-reference-proof.swap > receipts/swap-setup.log
          sudo swapon /mnt/wbs090-command-reference-proof.swap
          free -m > receipts/memory-with-swap.txt
      - name: Download and verify the retained immutable evaluator package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Prosperous-Unification/puni-00/actions/artifacts/12029728928/zip > evaluator-artifact.zip
          python3 proof/openspec/changes/wbs-burokrat-evaluation/evidence/command-reference-hosted-proof/prove.py recover
      - name: Install one independent consumer from the pinned tarball
        working-directory: consumer
        shell: bash
        run: |
          set -euo pipefail
          bun add --exact --ignore-scripts ../receipts/twilight-burokrat-0.1.0.tgz > ../receipts/consumer-install.log 2>&1
      - name: Verify installed toolkit and executable identities
        run: python3 proof/openspec/changes/wbs-burokrat-evaluation/evidence/command-reference-hosted-proof/prove.py verify-installed
      - name: Serial selected F7, committed oversized fault, and full fourteen-rule comparisons
        run: python3 proof/openspec/changes/wbs-burokrat-evaluation/evidence/command-reference-hosted-proof/prove.py surveys
      - name: Preserve all immutable source proof receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wbs090-command-reference-e22e55f-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
      - name: Release ephemeral runner swap
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Proof: the production block under a PATH without rg failed the active-swap
          # shell regression by attempting rm before swapoff. Required state/tool and
          # swapoff failures now stop before rm (cleanup.test.mjs, 2026-10-16).
          swap_active=$(awk 'NR > 1 && $1 == "/mnt/wbs090-command-reference-proof.swap" { active = 1 } END { print active ? 1 : 0 }' /proc/swaps)
          if [[ "$swap_active" == 1 ]]; then
            sudo swapoff /mnt/wbs090-command-reference-proof.swap
          fi
          if [[ -f /mnt/wbs090-command-reference-proof.swap ]]; then
            sudo rm /mnt/wbs090-command-reference-proof.swap
          fi
