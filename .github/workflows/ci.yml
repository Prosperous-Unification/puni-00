      matrix:
        shard:
          - 1
    timeout-minutes: 3
    steps:
      - name: Bounded dependency
        id: dependency
        timeout-minutes: 3
        run: printf 'DEPENDENCY_READY setup_guarded\n'
      - name: Install chromium
        id: setup
        timeout-minutes: 1
        run: |-
          printf 'DELAY_STARTED setup_guarded\n'
          sleep 90
          printf 'DELAY_COMPLETED setup_guarded\n'
      - name: Layout gate
        id: layout
        timeout-minutes: 1
        run: printf 'PHASE_COMPLETED layout setup_guarded\n'
      - name: Activated organization context
