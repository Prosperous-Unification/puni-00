name: wbs100-hosted-estimate-ts6

on:
  push:
    branches: [integration/wbs100-hosted-estimate-ts6-20261020]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wbs100-hosted-estimate-ts6
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d7f2129598af7a3cb7ed3c7161e06d504b586891
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Prove adapter integrity refusals
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 proof/.github/proofs/wbs100-hosted-estimate-ts6/prove-adapter.py receipts
      - name: Run the retained explicit TypeScript 6 scope
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 proof/.github/proofs/wbs100-hosted-estimate-ts6/run-hosted.py source receipts
      - name: Preserve exact adapter inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          cp -R proof/.github/proofs/wbs100-hosted-estimate-ts6 receipts/proof-inputs
          cp proof/.github/workflows/wbs100-hosted-estimate-ts6.yml receipts/workflow.yml
      - name: Preserve scoped compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wbs100-hosted-estimate-ts6-d7f2129-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
