# The SQLite backup job's only egress besides DNS (wbs-dns): the local platform's object store (infra/platform/backup/local).
# Secret wbs-solver/sqlite-backup-s3 (endpoint, bucket, region, access-key-id,
# secret-access-key) is an input of this environment, never committed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlite-backup-egress
  namespace: wbs-solver
spec:
  podSelector:
    matchLabels:
      puni.dev/workload: sqlite-backup
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: puni-backup
      ports:
        - { protocol: TCP, port: 9000 }
