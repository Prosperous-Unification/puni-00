# Loopback lab profile. Every value here is a lab-only test value, never a credential used
# anywhere else. Storage is F6's single-node puni-local class.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - backup-egress.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: wbs-backend-config
    namespace: wbs-solver
    literals:
      # The images set NODE_ENV=production, which forbids local auth; the lab is not production.
      - NODE_ENV=lab
      - AUTH_MODE=local
      - BROWSER_SESSION_AUTHORITY=disabled
      # Required by be-01 with no default (wbs-organization-limits L7).
      - ORGANIZATION_DEFAULT_MAX_AGENT_PERSONS=50
      - ORGANIZATION_DEFAULT_MAX_CONCURRENT_CLAIMS=200
      - ORGANIZATION_DEFAULT_MAX_CAPACITY_UNITS_PER_RESOURCE=10000
      - APP_ORIGIN=http://localhost:8080
  - name: wbs-gateway-config
    namespace: wbs
    literals:
      - NODE_ENV=lab
      - AUTH_MODE=local
      - LOG_LEVEL=info
      - BE_URL=http://wbs-backend.wbs-solver.svc.cluster.local:3100
  - name: wbs-mcp-config
    namespace: wbs
    literals:
      - MCP_AUTH_MODE=gateway
      - MCP_TRUSTED_GATEWAY=true
      - WBS_API_URL=http://wbs-backend.wbs-solver.svc.cluster.local:3100
      - MCP_PUBLIC_URL=http://localhost:8080/mcp
secretGenerator:
  - name: wbs-backend-secrets
    namespace: wbs-solver
    literals:
      - INTERNAL_AUTH_SECRET=lab-only-internal-auth-secret-0000000000
      - JWT_SIGNING_KEY_CURRENT=lab-only-jwt-signing-key-00000000000000
  - name: wbs-gateway-secrets
    namespace: wbs
    literals:
      - INTERNAL_AUTH_SECRET=lab-only-internal-auth-secret-0000000000
      - JWT_SIGNING_KEY_CURRENT=lab-only-jwt-signing-key-00000000000000
patches:
  - target: { kind: PersistentVolumeClaim, name: wbs-data }
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: puni-local
  - target: { kind: PersistentVolumeClaim, name: wbs-mcp }
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: puni-local
  - target: { kind: CronJob, name: 'sqlite-backup(-verify)?' }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value: { name: NODE_EXTRA_CA_CERTS, value: /s3-trust/ca.crt }
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
        value: { name: s3-trust, mountPath: /s3-trust, readOnly: true }
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/-
        value: { name: s3-trust, secret: { secretName: sqlite-backup-s3 } }
  - target: { kind: CronJob, name: sqlite-backup }
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: { name: sqlite-backup }
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: backup
                    env:
                      - { name: S3_TRUST_MODE, value: system-roots-plus-ca }
  - target: { kind: CronJob, name: sqlite-backup-verify }
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: { name: sqlite-backup-verify }
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: verify
                    env:
                      - { name: S3_TRUST_MODE, value: system-roots-plus-ca }
