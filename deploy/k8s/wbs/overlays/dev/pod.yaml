# The forge admission (`infra/platform/policy/trusted-workloads.yaml`) admits this Pod only with
# the controller label and service account, the forge node, the approved image digest and exact
# Directory hostPaths. `dev-env` creates it while impersonating that service account, the only
# identity the forge Role lets create Pods here.
apiVersion: v1
kind: Pod
metadata:
  name: dev-environment
  labels:
    app.kubernetes.io/name: dev-environment
    app.kubernetes.io/part-of: wbs
    puni.dev/controller: dev-environment
spec:
  serviceAccountName: dev-environment-controller
  automountServiceAccountToken: false
  nodeSelector:
    puni.dev/capability-forge: 'true'
  restartPolicy: Always
  terminationGracePeriodSeconds: 20
  securityContext:
    # Replaced by dev-env with the worktree owner, so node_modules and .nx stay theirs.
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: source
      image: dev-environment
      workingDir: /src
      command: [bun, tools/tool-devsync/src/k3s/forge-supervisor.ts]
      ports:
        - { name: web, containerPort: 4200 }
        - { name: mcp, containerPort: 3300 }
      env:
        - { name: NODE_ENV, value: development }
        # Nx keeps daemon state under .nx/ in the worktree; a recreated Pod would wait on the
        # dead daemon's locks (`deploy/dev-src/compose.yml`).
        - { name: NX_DAEMON, value: 'false' }
        # Writable for any owner UID dev-env binds; the image's /home/bun belongs to UID 1000.
        - { name: HOME, value: /tmp }
        # The environment's own database on its own volume, never the worktree's local.db.
        - { name: DB_PATH, value: /data/wbs.db }
        # Bound by dev-env to http://<slug>.localhost:<port>.
        - { name: APP_ORIGIN, value: http://dev-environment.localhost }
        - { name: MCP_AUTH_MODE, value: standalone }
        - { name: WBS_API_URL, value: http://127.0.0.1:3100 }
        - { name: MCP_PUBLIC_URL, value: http://dev-environment.localhost/mcp }
      readinessProbe:
        httpGet: { path: /health, port: 3100 }
        periodSeconds: 5
        failureThreshold: 3
      startupProbe:
        httpGet: { path: /, port: web }
        periodSeconds: 5
        failureThreshold: 60
      resources:
        requests: { cpu: 250m, memory: 768Mi }
        # compose.yml's measured 278 MiB steady state had 5x headroom at 1536m; a cold Vite
        # transform of the whole app peaks above that.
        limits: { memory: 2Gi }
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
      volumeMounts:
        - { name: worktree, mountPath: /src }
        - { name: data, mountPath: /data }
        # The runtime directory, not supervisor.sock: the supervisor may replace its socket
        # inode, and only a directory mount lets this Pod see the replacement.
        - { name: solver-runtime, mountPath: /run/wbs-solver, readOnly: true }
  volumes:
    - name: worktree
      hostPath: { path: /srv/puni/worktrees/unbound, type: Directory }
    - name: data
      persistentVolumeClaim: { claimName: dev-environment-data }
    - name: solver-runtime
      hostPath: { path: /run/puni/solver, type: Directory }
