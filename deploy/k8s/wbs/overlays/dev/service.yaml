apiVersion: v1
kind: Service
metadata:
  name: dev-environment
spec:
  selector:
    app.kubernetes.io/name: dev-environment
  ports:
    # be-01 and gw-01 are reached through Vite's edge proxy (`/api/`, `/ws`), as on h2puni.
    - { name: web, port: 4200, targetPort: web }
    - { name: mcp, port: 3300, targetPort: mcp }
