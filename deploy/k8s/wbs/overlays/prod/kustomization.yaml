# prod profile: plan-only in F8. The operator provisions wbs-mcp-secrets through SOPS;
# externally-provided.json declares its key contract without storing credentials here.
# OIDC settings are deployment inputs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - backup-egress.yaml
  - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: wbs-backend-config
    namespace: wbs-solver
    literals:
      - AUTH_MODE=oidc
      - BROWSER_SESSION_AUTHORITY=disabled
      # Required by be-01 with no default (wbs-organization-limits L7).
      - ORGANIZATION_DEFAULT_MAX_AGENT_PERSONS=50
      - ORGANIZATION_DEFAULT_MAX_CONCURRENT_CLAIMS=200
      - ORGANIZATION_DEFAULT_MAX_CAPACITY_UNITS_PER_RESOURCE=10000
      # Sign-in buttons stay off until organization activation (social-sign-in).
      - AUTH_METHODS=none
      - AUTH_REDIRECT_URI=https://wbs.bulletpoints.club/api/auth/okta/callback
      # mcp-01's issuer, <MCP_PUBLIC_URL>/oauth exactly (wbs-mcp-agent-surface M2); an
      # activated store refuses to boot without it. Not a secret.
      # Proof: removing it, or adding a trailing slash, made mcp-manifest.test.ts fail on 2026-10-28.
      - WBS_MCP_AUTHORIZATION_SERVER=https://wbs.bulletpoints.club/mcp/oauth
  - name: wbs-gateway-config
    namespace: wbs
    literals:
      - AUTH_MODE=oidc
      - LOG_LEVEL=info
      - BE_URL=http://wbs-backend.wbs-solver.svc.cluster.local:3100
      - AUTH_REDIRECT_URI=https://wbs.bulletpoints.club/api/auth/okta/callback
  - name: wbs-mcp-config
    namespace: wbs
    literals:
      - MCP_AUTH_MODE=standalone
      # One hop: the Traefik Ingress (ingress.yaml). Whatever stands in front of Traefik is not
      # in this repository, so it is not counted (wbs-mcp-agent-surface M10).
      - MCP_TRUSTED_PROXY_HOPS=1
      - WBS_API_URL=http://wbs-backend.wbs-solver.svc.cluster.local:3100
      - MCP_PUBLIC_URL=https://wbs.bulletpoints.club/mcp
patches:
  - target: { kind: PersistentVolumeClaim, name: wbs-data }
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: puni-retain
  - target: { kind: PersistentVolumeClaim, name: wbs-mcp }
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: puni-retain
  # Backend OIDC egress (issuer discovery/JWKS over HTTPS) beyond the base allowances.
  - target: { kind: NetworkPolicy, name: wbs-backend-egress }
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          ports:
            - { protocol: TCP, port: 443 }
