apiVersion: apps/v1
kind: Deployment
metadata:
  name: wbs-mcp
  namespace: wbs
  labels:
    app.kubernetes.io/name: wbs-mcp
    app.kubernetes.io/part-of: wbs
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wbs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wbs-mcp
        app.kubernetes.io/part-of: wbs
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: wbs-mcp
          ports:
            - name: http
              containerPort: 3300
          env:
            - { name: PORT, value: '3300' }
            - { name: HOME, value: /tmp }
            - { name: MCP_STORE_PATH, value: /var/lib/wbs-mcp/sessions.sqlite }
            # Proof: removing this Secret ref made mcp-manifest.test.ts fail on 2026-09-27.
            - name: MCP_STORE_KEY_CURRENT
              valueFrom:
                secretKeyRef: { name: wbs-mcp-secrets, key: MCP_STORE_KEY_CURRENT }
            - name: MCP_STORE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef: { name: wbs-mcp-secrets, key: MCP_STORE_KEY_PREVIOUS, optional: true }
            - name: MCP_SIGNING_KEY_CURRENT
              valueFrom:
                secretKeyRef: { name: wbs-mcp-secrets, key: MCP_SIGNING_KEY_CURRENT }
            - name: MCP_SIGNING_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  { name: wbs-mcp-secrets, key: MCP_SIGNING_KEY_PREVIOUS, optional: true }
          envFrom:
            - configMapRef:
                name: wbs-mcp-config
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: mcp-store, mountPath: /var/lib/wbs-mcp }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: mcp-store
          persistentVolumeClaim:
            claimName: wbs-mcp
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wbs-mcp
  namespace: wbs
  labels:
    app.kubernetes.io/part-of: wbs
spec:
  selector:
    app.kubernetes.io/name: wbs-mcp
  ports:
    - { name: http, port: 3300, targetPort: http }
