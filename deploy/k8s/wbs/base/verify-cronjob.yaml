# Scheduled restore verification: `backup-sqlite.ts verify` restores the newest report under
# sqlite/wbs/ into scratch, checks bytes, integrity and migration set against the report and
# refuses one captured more than 26 hours ago. It reads only object storage, but it runs next to
# sqlite-backup in wbs-solver: that namespace's secret, runner and egress policy are the only
# ones holding the backup's credentials, and F6 admits its pods only with the backend image,
# service account, controller label and a product node. The release coordinator rewrites this
# CronJob's image with the backend's (tools/tool-deploy/src/k8s/execute.ts); check-backup.ts
# compares every admitted field with the backend. A failed run raises PuniBackupJobFailed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqlite-backup-verify
  namespace: wbs-solver
  labels:
    app.kubernetes.io/part-of: wbs
spec:
  schedule: '45 3 * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: wbs
            puni.dev/controller: wbs-backend
            puni.dev/workload: sqlite-backup
        spec:
          restartPolicy: Never
          serviceAccountName: wbs-backend
          automountServiceAccountToken: false
          nodeSelector:
            puni.dev/capability-product: 'true'
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: verify
              image: wbs-backend
              command: [bun, /runner/backup-sqlite.ts, verify]
              env:
                - { name: BACKUP_DATABASE_NAME, value: wbs }
                - { name: BACKUP_PREFIX, value: sqlite }
                - { name: RESTORE_TARGET_PATH, value: /scratch/verify.sqlite }
                - { name: HOME, value: /scratch }
                - { name: TMPDIR, value: /scratch }
                - { name: BUN_RUNTIME_TRANSPILER_CACHE_PATH, value: '0' }
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: endpoint }
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: bucket }
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: region }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: access-key-id }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: secret-access-key }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: '1', memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile: { type: RuntimeDefault }
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: scratch, mountPath: /scratch }
                - { name: runner, mountPath: /runner, readOnly: true }
          volumes:
            - name: scratch
              emptyDir: { sizeLimit: 4Gi }
            - name: runner
              configMap: { name: sqlite-backup-runner }
