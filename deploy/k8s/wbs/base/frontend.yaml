# fe-01's Caddy image listens on :80 as root; here it serves the same /srv/www on :8080 as a
# non-root user so the pod meets Restricted Pod Security. The Service keeps port 80.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wbs-frontend-caddyfile
  namespace: wbs
  labels:
    app.kubernetes.io/part-of: wbs
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8080 {
      root * /srv/www
      try_files {path} /index.html
      file_server
      encode gzip
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wbs-frontend
  namespace: wbs
  labels:
    app.kubernetes.io/name: wbs-frontend
    app.kubernetes.io/part-of: wbs
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: wbs-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wbs-frontend
        app.kubernetes.io/part-of: wbs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: wbs-frontend
          command: [caddy, run, --config, /etc/wbs/Caddyfile, --adapter, caddyfile]
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: XDG_DATA_HOME, value: /tmp/data }
            - { name: XDG_CONFIG_HOME, value: /tmp/config }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            # The caddy binary carries a file capability; exec fails with EPERM unless that
            # capability is in the bounding set. no_new_privs still withholds it at runtime.
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/wbs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: caddyfile
          configMap:
            name: wbs-frontend-caddyfile
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: wbs-frontend
  namespace: wbs
  labels:
    app.kubernetes.io/part-of: wbs
spec:
  selector:
    app.kubernetes.io/name: wbs-frontend
  ports:
    - { name: http, port: 80, targetPort: http }
