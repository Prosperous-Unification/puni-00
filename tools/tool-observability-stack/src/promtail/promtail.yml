server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: wbs-services
    static_configs:
      - targets: [localhost]
        labels:
          job: wbs
          __path__: /var/log/wbs/*.log
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            version: version
            request_id: request_id
            connection_id: connection_id
            trace_id: trace_id
            span_id: span_id
            ws_subscription: ws_subscription
      - labels:
          service:
          level:
          version:
      - structured_metadata:
          request_id:
          connection_id:
          trace_id:
          span_id:
          ws_subscription:
