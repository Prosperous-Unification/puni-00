# Twilight execution profile, revision 10 (proposed; no runtime reads it yet).
#
# Compiled with schema.yaml, the repository manifest, provider capabilities
# and an explicit immutable organization snapshot into one workflow revision. See
# openspec/changes/twilight-control-plane/design.md, "Stages, activities and
# the execution profile" and "Levers, ledger and outcomes". Terms are defined
# in docs/twilight-structure/CONTEXT.md.
#
# Values here are repository defaults or policy. Profiles are defaults, not
# ceilings: authorized overrides may increase or decrease settings within
# current grants, capabilities, approved hard caps and repository/organization
# floors. The organization snapshot supplies floors, pools and the rate card;
# it is a required compiler input, never an implicit server lookup or fallback.
# Unknown keys, missing referenced ids and cycles in either DAG are errors.

version: 10

# `after` is the single stage DAG. Artifact mappings describe required inputs
# or evidence; schema.yaml's separate artifact DAG only decides file readiness.
# All-inactive stages record dispositions and preserve order, without claiming
# passed checks. Omitted scope is run. Within deliverable scope an edge binds
# that deliverable only; candidate scope joins its declared members, not every
# deliverable in the run. Handoff joins all required accepted outcomes.
# `release` also requires its separate explicit human command.
stages:
  - { id: request, after: [], artifact: intent }
  - { id: discovery, after: [request], artifact: intent }
  - { id: specification, after: [discovery], artifacts: [specs, design] }
  - { id: planning, after: [specification], artifact: tasks }
  - { id: implementation, after: [planning], scope: deliverable, tracks: tasks.md }
  - { id: knowledge, after: [implementation], scope: deliverable }
  - { id: review, after: [knowledge], scope: deliverable }
  - { id: verification, after: [review], scope: deliverable, artifact: verify }
  - { id: integration, after: [verification], scope: candidate }
  - { id: staging, after: [integration], scope: candidate, artifact: verify }
  - { id: acceptance, after: [staging], scope: candidate, artifact: verify }
  - { id: acceptance-report, after: [acceptance], scope: candidate, artifact: verify }
  - { id: coverage, after: [acceptance-report], scope: candidate, artifact: verify }
  - { id: publication, after: [coverage], scope: candidate, artifact: verify }
  - { id: handoff, after: [publication], artifact: verify }
  - { id: release, after: [handoff], command: release }

# The catalog declares execution kind; the selected repositoryFloor revision alone
# declares mandatory activities. Every profile supplies a total activities map. Tools use registered
# implementations, agents resolve a class model or explicit activity model.
# resources is a minimum per-attempt vector, augmented by registered executor
# requirements and resolved provider/model rate limits, never replaced by them.
activities:
  - {
      id: discovery.research,
      stage: discovery,
      class: research,
      executor: agent,
      resources: { agent: 1 },
    }
  - {
      id: discovery.review,
      stage: discovery,
      class: review,
      executor: agent,
      resources: { agent: 1, reviewer: 1 },
    }
  - {
      id: specification.critique,
      stage: specification,
      class: review,
      executor: agent,
      resources: { agent: 1, reviewer: 1 },
    }
  - {
      id: specification.scenarios,
      stage: specification,
      class: verify,
      executor: tool,
      implementation: registered:scenario-coverage,
      resources: { workspace: 1 },
    }
  - { id: planning.plan, stage: planning, class: plan, executor: agent, resources: { agent: 1 } }
  - {
      id: implementation.implement,
      stage: implementation,
      class: implement,
      executor: agent,
      resources: { agent: 1, workspace: 1 },
    }
  - {
      id: implementation.branch-dev,
      stage: implementation,
      class: verify,
      executor: tool,
      implementation: registered:branch-dev-observer,
      resources: { branchDevEnvironment: 1 },
    }
  - {
      id: review.critic,
      stage: review,
      class: review,
      executor: agent,
      resources: { agent: 1, reviewer: 1 },
    }
  - {
      id: review.judge,
      stage: review,
      class: judge,
      executor: agent,
      resources: { agent: 1, reviewer: 1 },
    }
  - {
      id: verification.gate,
      stage: verification,
      class: verify,
      executor: tool,
      implementation: registered:repository-gate,
      resources: { build: 1, workspace: 1 },
    }
  - {
      id: verification.browser,
      stage: verification,
      class: verify,
      executor: tool,
      implementation: registered:browser-gate,
      resources: { browser: 1, workspace: 1 },
    }
  - {
      id: integration.compose,
      stage: integration,
      class: integrate,
      executor: tool,
      implementation: registered:integration-queue,
      resources: { build: 1, workspace: 1 },
    }
  - {
      id: staging.deploy,
      stage: staging,
      class: verify,
      executor: tool,
      implementation: registered:staging-deploy,
      resources: { build: 1 },
    }
  - {
      id: acceptance.cloud-browser,
      stage: acceptance,
      class: verify,
      executor: agent,
      resources: { agent: 1, browser: 1 },
    }
  - {
      id: acceptance.browser-report,
      stage: acceptance-report,
      class: verify,
      executor: tool,
      implementation: registered:cloud-browser-report,
      resources: {},
    }
  - {
      id: acceptance.coverage,
      stage: coverage,
      class: verify,
      executor: tool,
      implementation: registered:scenario-test-coverage,
      resources: { workspace: 1 },
    }
  - {
      id: knowledge.reconcile,
      stage: knowledge,
      class: knowledge,
      executor: agent,
      resources: { agent: 1, workspace: 1 },
    }
  - {
      id: publication.main,
      stage: publication,
      class: integrate,
      executor: tool,
      implementation: registered:publish-candidate,
      resources: { workspace: 1 },
    }
  - {
      id: handoff.dev-main,
      stage: handoff,
      class: verify,
      executor: tool,
      implementation: registered:dev-main-converge,
      resources: {},
    }
  - {
      id: acceptance.evaluate,
      stage: acceptance,
      class: verify,
      executor: tool,
      implementation: registered:task-acceptance,
      resources: { build: 1, workspace: 1 },
    }
  - {
      id: release.production,
      stage: release,
      class: integrate,
      executor: tool,
      implementation: registered:production-deploy,
      resources: { build: 1 },
    }

# Lifecycle points are `<event>.<stage or activity id>`; `*` matches every
# valid subject. Wildcard-only events use `*`; triggerKinds selects
# declared trigger kinds (manual, schedule, webhook), never a fictitious stage.
# Events: beforeStage, afterStage, beforeActivity,
# afterActivity, beforeTool, afterTool, onFinding, onApproval, onRework,
# onFailure, onCancel, onTrigger, onProfileChange, onBudgetThreshold,
# onReconciling.
policies:
  beforeStage.implementation:
    approval: { required: true, decidedBy: human, subject: execution-envelope }
  beforeActivity.*:
    admission: { resourcesFrom: activity, budgetFrom: run }
  beforeTool.*:
    egress: deny
    credentials: scoped
  onFinding.review.critic:
    blockingSeverities: [critical, high]
  onRework.*:
    scope: affected-dependency-closure
    maxRounds: { from: profile, path: rework.maxRounds }
    exhausted: pause
  onFailure.verification.gate:
    action: pause
    scope: affected-dependency-closure
  onCancel.*:
    drain: settle-then-release
  onTrigger.*:
    triggerKinds: [schedule]
    timezone: required
    overlap: skip
    missed: skip
    retries: { max: 2, backoff: PT5M }
  onProfileChange.*:
    record: event
  onBudgetThreshold.*:
    record: event
  onReconciling.*:
    record: event

# Registered implementations or sandboxed commands only; never code from a
# browser text field. A mandatory hook denies on timeout, unavailable
# dependency or malformed decision; an optional hook may report `degraded`.
hooks:
  - id: secrets-scan
    implementation: registered:tool-secrets
    version: 1
    at: [afterActivity.implementation.implement, afterActivity.verification.gate]
    mandatory: true
    timeoutMs: 60000
    onTimeout: deny
    capabilities: [read:workspace]
    idempotency: pure
  - id: notify-operator
    implementation: registered:notifications
    version: 1
    at:
      [
        onApproval.*,
        onFailure.*,
        onCancel.*,
        onBudgetThreshold.*,
        onReconciling.*,
        afterStage.handoff,
      ]
    mandatory: false
    timeoutMs: 10000
    onTimeout: degrade
    capabilities: [send:notification]
    idempotency: at-least-once

# Proposed starting values, not measurements (A45). Enabled agents and every
# permitted escalation need supported model/effort capabilities and prices for
# hard money caps. Disabled activities are validated again before enabling.
# activities is the only enablement/depth source; there are no parallel skip,
# judge or browserGate switches. verification.gate always runs the full repo
# gate. Cloud acceptance is disabled under factory-core; Task 13 must prove every
# adapter before personal-delivery can force its additional activities enabled.
# Overrides merge maps by key, replace scalars/arrays, and require a reason;
# per-activity models replace class defaults. Unknown or conflicting fields fail.
# rework.maxRounds counts consumed rounds across profile epochs, including zero.
# budget.limits are strict caps; advisory uses them as warning targets and MUST
# supply explicit hardLimits in the same units, at least as high as each target.
# Optional warningThresholds are same-unit values below the applicable hard vector;
# no starting profile adds intermediate thresholds before measured operator need.
# moneyScope selects priced model spend or all delivery charges; delivery requires
# defensible bounds for every charge category. Both scopes expose cost coverage.
# agentTime adds occupied agent-session time across attempts. deadline is a
# duration from the ORIGINAL run creation, including all waiting and pauses.
attemptOutcomes:
  providerUnavailable:
    escalationTrigger: false
    reworkRound: false
    sameModelRetries: 2
    exhausted: pause

profiles:
  default: balanced
  thorough:
    models:
      research: { provider: anthropic, model: claude-opus-5 }
      plan: { provider: anthropic, model: claude-opus-5 }
      implement: { provider: anthropic, model: claude-opus-5, effort: high }
      review: { provider: anthropic, model: claude-fable-5-1 }
      judge: { provider: anthropic, model: claude-fable-5-1 }
      verify: { provider: anthropic, model: claude-sonnet-5 }
      knowledge: { provider: anthropic, model: claude-sonnet-5 }
    escalation: []
    activities:
      discovery.research: { enabled: true }
      discovery.review: { enabled: true }
      specification.critique: { enabled: true }
      specification.scenarios: { enabled: true }
      planning.plan: { enabled: true }
      implementation.implement: { enabled: true }
      implementation.branch-dev: { enabled: false }
      review.critic: { enabled: true, count: 2 }
      review.judge: { enabled: true }
      verification.gate: { enabled: true }
      verification.browser: { enabled: true, scope: whole }
      integration.compose: { enabled: true }
      staging.deploy: { enabled: false }
      acceptance.cloud-browser: { enabled: false }
      acceptance.browser-report: { enabled: false }
      acceptance.coverage: { enabled: true }
      knowledge.reconcile: { enabled: true }
      publication.main: { enabled: false }
      handoff.dev-main: { enabled: false }
      acceptance.evaluate: { enabled: true }
      release.production: { enabled: false }
    rework: { maxRounds: 3 }
    fanOut: 2
    budget:
      scope: run
      moneyScope: model
      enforcement: strict
      limits: { tokens: 3000000, money: { amount: 100, currency: USD }, agentTime: PT12H }
    deadline: null
  balanced:
    models:
      research: { provider: anthropic, model: claude-sonnet-5 }
      plan: { provider: anthropic, model: claude-opus-5 }
      implement: { provider: anthropic, model: claude-sonnet-5, effort: medium }
      review: { provider: anthropic, model: claude-opus-5 }
      judge: { provider: anthropic, model: claude-opus-5 }
      verify: { provider: anthropic, model: claude-sonnet-5 }
      knowledge: { provider: anthropic, model: claude-haiku-4-5-20251001 }
    escalation:
      - class: implement
        to: { provider: anthropic, model: claude-opus-5, effort: high }
        when: [refusal, gateFailure, blockingFinding]
        maxSteps: 1
    activities:
      discovery.research: { enabled: true }
      discovery.review: { enabled: true }
      specification.critique: { enabled: true }
      specification.scenarios: { enabled: true }
      planning.plan: { enabled: true }
      implementation.implement: { enabled: true }
      implementation.branch-dev: { enabled: false }
      review.critic: { enabled: true, count: 1 }
      review.judge: { enabled: true }
      verification.gate: { enabled: true }
      verification.browser: { enabled: true, scope: affected }
      integration.compose: { enabled: true }
      staging.deploy: { enabled: false }
      acceptance.cloud-browser: { enabled: false }
      acceptance.browser-report: { enabled: false }
      acceptance.coverage: { enabled: true }
      knowledge.reconcile: { enabled: true }
      publication.main: { enabled: false }
      handoff.dev-main: { enabled: false }
      acceptance.evaluate: { enabled: true }
      release.production: { enabled: false }
    rework: { maxRounds: 2 }
    fanOut: 2
    budget:
      scope: run
      moneyScope: model
      enforcement: strict
      limits: { tokens: 1500000, money: { amount: 40, currency: USD }, agentTime: PT6H }
    deadline: null
  economy:
    models:
      research: { provider: anthropic, model: claude-haiku-4-5-20251001 }
      plan: { provider: anthropic, model: claude-sonnet-5 }
      implement: { provider: anthropic, model: claude-haiku-4-5-20251001, effort: low }
      review: { provider: anthropic, model: claude-sonnet-5 }
      judge: { provider: anthropic, model: claude-sonnet-5 }
      verify: { provider: anthropic, model: claude-sonnet-5 }
      knowledge: { provider: anthropic, model: claude-haiku-4-5-20251001 }
    escalation:
      - class: implement
        to: { provider: anthropic, model: claude-sonnet-5, effort: medium }
        when: [refusal, gateFailure]
        maxSteps: 1
    activities:
      discovery.research: { enabled: true }
      discovery.review: { enabled: false }
      specification.critique: { enabled: true }
      specification.scenarios: { enabled: true }
      planning.plan: { enabled: true }
      implementation.implement: { enabled: true }
      implementation.branch-dev: { enabled: false }
      review.critic: { enabled: true, count: 1 }
      review.judge: { enabled: false }
      verification.gate: { enabled: true }
      verification.browser: { enabled: false, scope: affected }
      integration.compose: { enabled: true }
      staging.deploy: { enabled: false }
      acceptance.cloud-browser: { enabled: false }
      acceptance.browser-report: { enabled: false }
      acceptance.coverage: { enabled: true }
      knowledge.reconcile: { enabled: true }
      publication.main: { enabled: false }
      handoff.dev-main: { enabled: false }
      acceptance.evaluate: { enabled: true }
      release.production: { enabled: false }
    rework: { maxRounds: 1 }
    fanOut: 4
    budget:
      scope: run
      moneyScope: model
      enforcement: strict
      limits: { tokens: 500000, money: { amount: 12, currency: USD }, agentTime: PT2H }
    deadline: PT4H

# Every referenced evidence id is declared once here. Registered producers and
# access/redaction rules are compiled with the selected floor.
evidenceCatalog:
  - { id: redaction, producer: registered:evidence-redaction }
  - { id: run-ledger, producer: registered:run-ledger }
  - { id: served-source-identity, producer: registered:environment-observe }
  - { id: branch-dev-observation, producer: registered:branch-dev-observer }

# Floor revisions let the factory core prove itself before deployment adapters
# exist. Selecting a floor forces its activities enabled after profile resolution.
# Task 13 publishes personal-delivery through the same authorized workflow change
# as any later floor revision; it cannot be selected while an implementation is
# unavailable. What no profile/run override may remove is revision-specific.
repositoryFloor:
  defaultRevision: factory-core
  revisions:
    factory-core:
      terminalStage: handoff
      acceptedOutcome: candidate-accepted-at-handoff
      activities:
        - specification.critique
        - specification.scenarios
        - knowledge.reconcile
        - verification.gate
        - verification.browser
        - integration.compose
        - acceptance.evaluate
        - acceptance.coverage
      hooks: [secrets-scan]
      approvals: [beforeStage.implementation]
      commands: []
      evidence: [redaction, run-ledger]
    personal-delivery:
      extends: factory-core
      terminalStage: release
      acceptedOutcome: release-observed-in-production
      activities:
        - implementation.branch-dev
        - staging.deploy
        - acceptance.cloud-browser
        - acceptance.browser-report
        - publication.main
        - handoff.dev-main
        - release.production
      hooks: [notify-operator]
      approvals: []
      commands: [release]
      evidence: [served-source-identity, branch-dev-observation]

# Named authority for discovery before a plan exists (assumption A29).
discoveryEnvelopes:
  default:
    writePaths: ['openspec/changes/**', 'docs/**']
    readOnlyCode: true
    providers: [anthropic]
    # Suballocation of the run account, never a second spending allowance.
    allowance: { tokens: 300000, money: { amount: 10, currency: USD }, agentTime: PT2H }
    deadline: P2D

# Per-repository capacity defaults; organization pools sit above them.
capacity:
  agentSlots: 2
  secretarySlots: 1
  # Provisional repository request under A67; the organization pool may bind lower.
  branchDevEnvironmentSlots: 2
  # The organization snapshot must supply a non-zero provider-specific reserve;
  # worker admission receives only the capacity left above it.
  secretaryProviderReserve: required
  workspaceWritersPerLineage: 1
  reviewerReserve: 1
  buildSlots: 1
  browserSlots: 1
  queue: { priority: critical-path, selection: feasible-ready, aging: PT30M, perClientCeiling: 4 }

# These are proposed controls; publication grants no spending or pool authority.
# The execution envelope pins permitted choices; a profile only selects defaults.
execution:
  objective: minimize-accepted-elapsed
  quality: fixed-within-envelope
  envelope: explicit-at-plan-approval
  capacity: provision-constrained-pool-within-grant
  speculation: { defaultEnabled: false, maxAttemptsPerDeliverable: 2 }

scalingAcceptance:
  floorRevision: factory-core
  acceptedOutcome: candidate-accepted-at-handoff
  workers: [1, 2, 4, 8]
  repetitions: 5
  workloads: [independent, decomposable, contended-recovery]
  fixed: [requirements, models, quality, evaluator, fixture]
  authorizedControls: { fanOut: 8, perClientCeiling: 8, agentSlotsCeiling: 8 }
  minimumIndependentSpeedup: { at4: 2, at8: 3 }
  minimumDecomposableSpeedup: { at4: 1.5 }
  coordinator: { sessions: 64, effectsPerSecond: 100, duration: PT10M, p95DispatchMs: 100 }

# Presentation is a per-actor preference; this is the repository default.
presentation:
  focusProfile:
    default: off
    adaptation: i-have-adhd
    adaptationInspected: 2026-09-06
    decisionBatch: 5
    parkingLot: true
    resumeCue: true
  updateCadence: PT5S

# Retention references an organization policy revision; these are the
# repository defaults until one is published (assumption A17).
retention:
  organizationPolicy: null
  metadata: no-age-expiry
  redactedContent: no-age-expiry
  searchableCorpusBytes: 10737418240
  operationalEvidenceAfterTerminal: P365D

# Scheduled runs use the same admission/evidence path. Coalescing requires exact
# source, configuration and scenario identity and records a disposition, not a pass.
scheduledSweeps:
  enabledByFloor: personal-delivery
  cadence: P1D
  targets: [dev-main, active-branch-devs]
  workflow: dev-sweep
  unchanged: coalesce-with-linked-report
  staging: immediate-never-coalesce

# A human publishes this bounded recurring authority separately from a delivery
# run. Every occurrence copies the allowance into a new budget account.
triggerEnvelopes:
  dev-sweep:
    decidedBy: human
    profile: balanced
    moneyScope: model
    allowance: { tokens: 200000, money: { amount: 8, currency: USD }, agentTime: PT1H }
    deadline: PT2H

# The explicit release command creates this candidate-bound allowance. It can
# admit only release.production and does not reset the delivery run clock.
releaseEnvelope:
  decidedBy: human
  activity: release.production
  account: same-run
  chargeScope: release-delivery-only
  limits: { money: { amount: 20, currency: USD } }
  deadline: PT2H
  decisionDeadlineAfterHandoff: P30D

triggerWorkflows:
  dev-sweep:
    enabledByFloor: personal-delivery
    admission:
      envelope: dev-sweep
      budgetAccount: per-occurrence
    activities:
      - {
          id: observe,
          executor: tool,
          implementation: registered:environment-observe,
          resources: {},
        }
      - {
          id: exercise,
          after: [observe],
          executor: agent,
          class: verify,
          resources: { agent: 1, browser: 1 },
        }
      - {
          id: report,
          after: [exercise],
          executor: tool,
          implementation: registered:dev-sweep-report,
          resources: {},
        }
    requiredByFloor: personal-delivery

# Knowledge operations profile (docs/twilight-structure/knowledge.md).
knowledge:
  retrievalProvider: indexes-and-rg
  benchmark: { questions: 20, correctness: 0.9, traceability: 1.0, effort: recorded }
  claimStatuses: [proposed, observed, accepted, stale, superseded]

# Canonical evaluation definition; workflow publication requires the organization
# evaluation-publisher capability plus a human decision when this subtree changes.
# Compiler hashes quality, rubric and observationSet independently; submit_request
# pins those revisions from its compiled workflow. No delivery-profile override.
# acceptance.evaluate uses the task fixture's independently authored assertions;
# acceptance.coverage joins specified scenarios to layered reports/dispositions.
# Missing assertions or mappings block acceptance as unavailable, never a pass.
# Both floor activities charge the run account before candidate acceptance completes.
quality:
  id: delivery-baseline
  rubric:
    id: contract-and-regression
    criteria: [task-acceptance, repository-gate, scenario-test-coverage]
  observationSet:
    - { id: task-acceptance, activity: acceptance.evaluate }
    - { id: repository-gate, activity: verification.gate }
    - { id: scenario-test-coverage, activity: acceptance.coverage }
  cohortFields: [repositoryId, taskFixtureDigest, evaluationRevision]
  escapedDefectWindow: P30D
  acceptedOutcomeFrom: selected-floor
  estimateCalibration: per-task
