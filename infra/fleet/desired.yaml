schemaVersion: 1
revision: production-h4claw-h3mon-v1
clusters:
  - id: platform
    purpose: platform
    apiEndpoint: https://10.1.0.4:6443
    controlPlane: single
    bootstrap: required
    requiredCapabilities: { product: 1, ingress: 1, observability: 1 }
  - id: workers
    purpose: workers
    apiEndpoint: https://workers.example.invalid:6443
    controlPlane: single
    bootstrap: required
    requiredCapabilities: { execution: 2 }
nodes:
  - id: h4claw
    cluster: platform
    capabilities: [control-plane, product, ingress]
    lifecycle: present
    provider: { kind: ssh, machineId: 'operator-input:h4claw /etc/machine-id', address: 10.1.0.4 }
  - id: h3mon
    cluster: platform
    capabilities: [observability]
    lifecycle: present
    provider: { kind: ssh, machineId: 'operator-input:h3mon /etc/machine-id', address: 10.1.0.2 }
