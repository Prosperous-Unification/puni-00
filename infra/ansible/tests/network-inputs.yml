---
# Runs the network role's input assertions against facts node-roles.test.ts supplies, so the MTU
# guard is exercised before any link changes. Touches no host.
- name: Assert the network role's inputs against supplied facts
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Run the role's input assertions
      ansible.builtin.include_tasks: ../roles/network/tasks/inputs.yml
