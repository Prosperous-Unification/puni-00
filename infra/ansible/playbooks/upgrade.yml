---
- name: Upgrade k3s one node at a time
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Require exact upgrade and artifact evidence
      ansible.builtin.assert:
        that:
          - puni_node_name is defined
          - puni_kube_context is defined
          - puni_k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
          - puni_k3s_download_url is defined
          - puni_k3s_sha256 is match('^[0-9a-f]{64}$')
          - puni_k3s_role in ['server', 'agent']
          - puni_k3s_role != 'server' or (puni_etcd_snapshot_receipt | default('') | length > 0)
        fail_msg: Upgrade requires a locked version, checksum, role, and server snapshot receipt
      tags: [always]

    - name: Read exact installed k3s version
      ansible.builtin.command:
        argv: [k3s, --version]
      register: puni_installed_k3s
      changed_when: false
      tags: [version]

    - name: Require reviewed or already-applied k3s version
      ansible.builtin.assert:
        that:
          - >-
            (puni_installed_k3s.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+'))
            in [puni_k3s_from_version, puni_k3s_version]
        fail_msg: Installed k3s version differs from reviewed upgrade transition
      tags: [version]

    - name: Emit exact installed k3s version
      ansible.builtin.debug:
        msg: >-
          PUNI_K3S_VERSION={{ puni_installed_k3s.stdout |
          regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}
      changed_when: false
      tags: [version]

    - name: Snapshot etcd before a server upgrade
      ansible.builtin.command:
        argv: [k3s, etcd-snapshot, save, --name, 'pre-upgrade-{{ puni_node_name }}']
      when:
        - puni_k3s_role == 'server'
        - puni_k3s_from_version != puni_k3s_version
      no_log: true

    - name: Cordon node
      ansible.builtin.command:
        argv: [kubectl, --context, '{{ puni_kube_context }}', cordon, '{{ puni_node_name }}']
      delegate_to: localhost
      become: false
      when: puni_k3s_from_version != puni_k3s_version

    - name: Drain node respecting disruption budgets
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            '{{ puni_kube_context }}',
            drain,
            '{{ puni_node_name }}',
            --ignore-daemonsets,
            --timeout=10m,
          ]
      delegate_to: localhost
      become: false
      when: puni_k3s_from_version != puni_k3s_version

    - name: Fetch exact k3s upgrade artifact
      ansible.builtin.get_url:
        url: '{{ puni_k3s_download_url }}'
        dest: /usr/local/bin/k3s
        checksum: 'sha256:{{ puni_k3s_sha256 }}'
        mode: '0755'
      when: puni_k3s_from_version != puni_k3s_version

    # Proof: the interrupted-upgrade production test leaves the binary at the target version after
    # a failed play; recovery still restarts the service and reaches the health gates below.
    - name: Restart k3s service before health proof
      ansible.builtin.systemd_service:
        name: '{{ "k3s" if puni_k3s_role == "server" else "k3s-agent" }}'
        state: restarted

    - name: Wait for exact node to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - '{{ puni_kube_context }}'
          - wait
          - node/{{ puni_node_name }}
          - --for=condition=Ready
          - --timeout=5m
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read unhealthy non-terminal workloads
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - '{{ puni_kube_context }}'
          - get
          - pods
          - --all-namespaces
          - --field-selector=status.phase!=Running,status.phase!=Succeeded
          - --output=name
      register: puni_unhealthy_workloads
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read unattached persistent volumes
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - '{{ puni_kube_context }}'
          - get
          - volumeattachments.storage.k8s.io
          - --output=jsonpath={range .items[?(@.status.attached==false)]}{.metadata.name}{"\n"}{end}
      register: puni_unattached_volumes
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read server etcd voter health
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - '{{ puni_kube_context }}'
          - get
          - node/{{ puni_node_name }}
          - --output=jsonpath={.status.conditions[?(@.type=="EtcdIsVoter")].status}
      register: puni_etcd_voter
      delegate_to: localhost
      become: false
      changed_when: false
      when: puni_k3s_role == 'server'

    - name: Require workload, storage, and etcd health
      ansible.builtin.assert:
        that:
          - puni_unhealthy_workloads.stdout | trim | length == 0
          - puni_unattached_volumes.stdout | trim | length == 0
          - puni_k3s_role != 'server' or puni_etcd_voter.stdout | trim == 'True'
        fail_msg: Upgrade health proof found unhealthy workloads, storage, or etcd membership
      delegate_to: localhost
      become: false

    - name: Uncordon node after health proof
      ansible.builtin.command:
        argv: [kubectl, --context, '{{ puni_kube_context }}', uncordon, '{{ puni_node_name }}']
      delegate_to: localhost
      become: false
