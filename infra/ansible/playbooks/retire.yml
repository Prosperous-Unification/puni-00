---
- name: Retire one exact k3s node
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Require reviewed retirement identity and recovery evidence
      ansible.builtin.assert:
        that:
          - puni_node_name is defined
          - puni_kubernetes_node_uid is defined
          - puni_provider_identity is defined
          - puni_backup_receipt is defined
          - puni_backup_receipt | length > 0
          - puni_control_plane_target is defined
          - puni_api_endpoint_host is defined
          - puni_minimum_surviving_control_planes | int >= 1
        fail_msg: Retirement requires exact node, provider, Kubernetes UID, and backup evidence
      tags: [preflight]

    - name: Prove embedded etcd is healthy before server retirement
      ansible.builtin.command:
        argv: [kubectl, get, --raw=/readyz/etcd]
      delegate_to: localhost
      become: false
      register: puni_etcd_health_before
      changed_when: false
      failed_when: puni_etcd_health_before.stdout | trim != 'ok'
      when: puni_control_plane_target | bool
      tags: [preflight]

    - name: Read live control-plane topology before server retirement
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          kubectl get nodes -o json |
          jq -e --argjson minimum '{{ puni_minimum_surviving_control_planes | int }}'
          '[.items[] | select(
          (.metadata.labels["node-role.kubernetes.io/control-plane"] != null) or
          (.metadata.labels["node-role.kubernetes.io/master"] != null))] |
          length > $minimum'
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      when: puni_control_plane_target | bool
      tags: [preflight]

    - name: Prove the registration endpoint survives server retirement
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          getent ahostsv4 '{{ puni_api_endpoint_host }}' |
          awk '{print $1}' | sort -u | grep -vxF '{{ ansible_host }}' | grep -q .
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      when: puni_control_plane_target | bool
      tags: [preflight]

    - name: Read exact Kubernetes node before retirement
      ansible.builtin.command:
        argv: [kubectl, get, node, '{{ puni_node_name }}', -o, json]
      delegate_to: localhost
      become: false
      register: puni_retirement_node
      changed_when: false
      tags: [preflight]

    - name: Require exact Kubernetes and provider identity
      ansible.builtin.assert:
        that:
          - (puni_retirement_node.stdout | from_json).metadata.uid == puni_kubernetes_node_uid
          - (puni_retirement_node.stdout | from_json).spec.providerID == puni_provider_identity
        fail_msg: Live node identity differs from the reviewed retirement target
      tags: [preflight]

    - name: Refuse unmanaged, local-state, forge, and singleton database workloads
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          kubectl get pods --all-namespaces --field-selector spec.nodeName={{ puni_node_name }} -o json |
          jq -e '[.items[] | select(
          (.metadata.annotations["puni.dev/unmanaged"] == "true") or
          (.metadata.labels["puni.dev/local-state"] == "true") or
          (.metadata.labels["puni.dev/forge-worktree"] == "true") or
          (.metadata.labels["puni.dev/singleton-sqlite"] == "true"))] | length == 0'
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [preflight]

    - name: Cordon exact node
      ansible.builtin.command:
        argv: [kubectl, cordon, '{{ puni_node_name }}']
      delegate_to: localhost
      become: false
      tags: [cordon]

    - name: Drain while respecting disruption budgets and local storage refusal
      ansible.builtin.command:
        argv:
          - kubectl
          - drain
          - '{{ puni_node_name }}'
          - --ignore-daemonsets
          - --timeout=10m
      delegate_to: localhost
      become: false
      tags: [drain]

    - name: Require all volume attachments detached
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          kubectl get volumeattachments.storage.k8s.io -o json |
          jq -e --arg node '{{ puni_node_name }}' '[.items[] | select(.spec.nodeName == $node)] | length == 0'
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      tags: [detach]

    - name: Read installed services
      ansible.builtin.service_facts:
      tags: [deconfigure]

    - name: Stop and disable installed k3s services
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: stopped
        enabled: false
      loop: [k3s, k3s-agent]
      when: (item + '.service') in ansible_facts.services
      tags: [deconfigure]

    - name: Remove node enrollment credentials
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/rancher/k3s/token
        - /etc/rancher/k3s/config.yaml
      tags: [deconfigure]

    - name: Remove exact Kubernetes membership
      ansible.builtin.command:
        argv: [kubectl, delete, node, '{{ puni_node_name }}', --wait=true, --timeout=2m]
      delegate_to: localhost
      become: false
      tags: [membership]

    - name: Prove embedded etcd and API remain healthy after server removal
      ansible.builtin.command:
        argv: [kubectl, get, --raw=/readyz/etcd]
      delegate_to: localhost
      become: false
      register: puni_etcd_health_after
      changed_when: false
      failed_when: puni_etcd_health_after.stdout | trim != 'ok'
      when: puni_control_plane_target | bool
      tags: [membership]

    - name: Verify services cannot re-register
      ansible.builtin.command:
        argv: [systemctl, is-enabled, '{{ item }}']
      register: puni_retired_service
      changed_when: false
      failed_when: puni_retired_service.rc == 0
      loop: [k3s, k3s-agent]
      tags: [verify]
