---
- name: Validate the complete cluster before making nodes schedulable
  hosts: k3s_bootstrap_servers
  become: true
  gather_facts: false
  vars:
    puni_all_nodes: "{{ groups['k3s_bootstrap_servers'] + groups['k3s_join_servers'] + groups['k3s_agents'] }}"
    puni_probe_namespace: puni-f3-validation
  tasks:
    - name: Require the pinned pod validation image
      ansible.builtin.assert:
        that:
          - puni_validation_image is defined
          - puni_validation_image is match('^.+@sha256:[0-9a-f]{64}$')
          - puni_validation_run_id is defined
          - puni_validation_run_id is match('^[0-9a-f]{16}$')
        fail_msg: A digest-pinned validation image and unique run identity are required

    - name: Wait for every expected node to become Ready
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready node/{{ item }} --timeout=180s
      loop: '{{ puni_all_nodes }}'
      changed_when: false

    - name: Read every Kubernetes node identity
      ansible.builtin.command: >-
        k3s kubectl get node {{ item }}
        -o 'jsonpath={.metadata.uid}|{.status.nodeInfo.machineID}|{.status.addresses[?(@.type=="InternalIP")].address}'
      loop: '{{ puni_all_nodes }}'
      register: puni_node_identities
      changed_when: false

    - name: Require stable Kubernetes and machine identities
      # Proof: the pinned-controller negative supplies a different intended machine ID to this exact
      # included assertion and exits 2 before enrollment taints can be removed.
      ansible.builtin.include_tasks: ../tasks/require-enrollment-identity.yml
      loop: '{{ puni_node_identities.results }}'
      loop_control:
        loop_var: puni_node_identity
      vars:
        puni_enrollment_uid: "{{ puni_node_identity.stdout.split('|')[0] }}"
        puni_enrollment_machine_id: "{{ puni_node_identity.stdout.split('|')[1] }}"
        puni_enrollment_address: "{{ puni_node_identity.stdout.split('|')[2] }}"
        puni_expected_machine_id: '{{ hostvars[puni_node_identity.item].puni_machine_id }}'
        puni_expected_address: '{{ hostvars[puni_node_identity.item].puni_node_ip }}'

    - name: Wait for the packaged CoreDNS deployment to exist
      ansible.builtin.command: >-
        k3s kubectl wait --for=create deployment/coredns
        --namespace kube-system --timeout=180s
      changed_when: false

    - name: Allow CoreDNS to start while enrollment remains restricted
      # Proof: kubectl v1.36.4 treated `--patch-file=-` as a literal missing file in the live
      # Ubuntu cluster and exited 1 before CoreDNS could be scheduled.
      ansible.builtin.command: >-
        k3s kubectl patch deployment coredns --namespace kube-system
        --type=strategic --patch-file=/dev/stdin
      args:
        stdin: |
          {"spec":{"template":{"spec":{"tolerations":[{"key":"puni.io/enrollment","operator":"Exists","effect":"NoSchedule"}]}}}}
      register: puni_coredns_toleration
      changed_when: "'(no change)' not in puni_coredns_toleration.stdout"

    - name: Wait for cluster DNS
      ansible.builtin.command: >-
        k3s kubectl rollout status deployment/coredns
        --namespace kube-system --timeout=180s
      changed_when: false

    - name: Apply fresh DNS and pod-network probes from every enrolling node
      # Proof: replacing per-run per-node names with one historical Job made the fresh-probe contract test fail.
      ansible.builtin.command: k3s kubectl apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ puni_probe_namespace }}
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: receiver
            namespace: {{ puni_probe_namespace }}
            labels:
              app: receiver
          spec:
            nodeName: {{ groups['k3s_bootstrap_servers'][0] }}
            tolerations:
              - key: puni.io/enrollment
                operator: Exists
              - key: puni.io/worker-control-plane
                operator: Exists
            containers:
              - name: receiver
                image: {{ puni_validation_image }}
                imagePullPolicy: IfNotPresent
                # Proof: the pinned k3s image exited 127 for both standalone and BusyBox `httpd`
                # in the live Ubuntu cluster; its inetd applet serves the bounded response instead.
                command:
                  - sh
                  - -c
                  - |
                    printf 'HTTP/1.1 200 OK\r\nContent-Length: 3\r\nConnection: close\r\n\r\nok\n' >/response
                    printf '#!/bin/sh\ncat /response\n' >/serve
                    chmod 0500 /serve
                    printf '8080 stream tcp nowait root /serve serve\n' >/inetd.conf
                    exec busybox inetd -f /inetd.conf
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: receiver
            namespace: {{ puni_probe_namespace }}
          spec:
            selector:
              app: receiver
            ports:
              - port: 8080
                targetPort: 8080
          {% for node in puni_all_nodes %}
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: dns-network-{{ loop.index }}-{{ puni_validation_run_id }}
            namespace: {{ puni_probe_namespace }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                nodeName: {{ node }}
                tolerations:
                  - key: puni.io/enrollment
                    operator: Exists
                  - key: puni.io/worker-control-plane
                    operator: Exists
                restartPolicy: Never
                containers:
                  - name: probe
                    image: {{ puni_validation_image }}
                    imagePullPolicy: IfNotPresent
                    command: [sh, -c, 'test "$(wget -qO- http://receiver.{{ puni_probe_namespace }}.svc.cluster.local:8080)" = ok']
          {% endfor %}
      register: puni_network_probe_apply
      changed_when: "'created' in puni_network_probe_apply.stdout or 'configured' in puni_network_probe_apply.stdout"

    - name: Wait for every fresh DNS and pod-network probe
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Complete
        job/dns-network-{{ ansible_loop.index }}-{{ puni_validation_run_id }}
        --namespace {{ puni_probe_namespace }} --timeout=180s
      loop: '{{ puni_all_nodes }}'
      loop_control:
        extended: true
      changed_when: false

    - name: Read enrollment taints
      ansible.builtin.command: >-
        k3s kubectl get node {{ item }} -o jsonpath={.spec.taints}
      loop: '{{ puni_all_nodes }}'
      register: puni_enrollment_taints
      changed_when: false

    - name: Remove enrollment taints after all validation passed
      ansible.builtin.command: >-
        k3s kubectl taint node {{ item.item }} puni.io/enrollment:NoSchedule-
      loop: '{{ puni_enrollment_taints.results }}'
      when: "'puni.io/enrollment' in item.stdout"
      changed_when: true

    - name: Apply the worker scheduling proof
      ansible.builtin.command: k3s kubectl apply -f -
      args:
        stdin: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: worker-scheduling-{{ puni_validation_run_id }}
            namespace: {{ puni_probe_namespace }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: activity
                    image: {{ puni_validation_image }}
                    imagePullPolicy: IfNotPresent
                    command: [sh, -c, 'true']
      register: puni_worker_probe_apply
      when: puni_cluster_id == 'workers'
      changed_when: "'created' in puni_worker_probe_apply.stdout or 'configured' in puni_worker_probe_apply.stdout"

    - name: Wait for the worker scheduling proof
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Complete
        job/worker-scheduling-{{ puni_validation_run_id }}
        --namespace {{ puni_probe_namespace }} --timeout=180s
      when: puni_cluster_id == 'workers'
      changed_when: false

    - name: Read the worker activity node
      ansible.builtin.command: >-
        k3s kubectl get pods --namespace {{ puni_probe_namespace }}
        --selector job-name=worker-scheduling-{{ puni_validation_run_id }}
        -o jsonpath={.items[0].spec.nodeName}
      register: puni_worker_probe_node
      when: puni_cluster_id == 'workers'
      changed_when: false

    - name: Refuse worker activity on its control-plane server
      ansible.builtin.assert:
        that:
          - puni_worker_probe_node.stdout not in groups['k3s_bootstrap_servers']
        fail_msg: Worker activity landed on the NoSchedule worker server
      when: puni_cluster_id == 'workers'
