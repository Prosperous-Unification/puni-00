---
- name: Configure and join additional k3s servers
  hosts: k3s_join_servers
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: base
    - role: network
    - role: storage
    - role: k3s_server
      puni_k3s_cluster_init: false

- name: Configure and join k3s agents
  hosts: k3s_agents
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: base
    - role: network
    - role: storage
    - role: k3s_agent
