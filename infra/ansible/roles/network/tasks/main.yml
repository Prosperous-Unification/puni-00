---
- name: Require private-network inputs
  ansible.builtin.assert:
    that:
      - puni_cluster_id is defined
      - puni_cluster_id | length > 0
      - puni_node_ip is defined
      - puni_node_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - puni_private_interface is defined
      - puni_private_interface in ansible_interfaces
      - puni_private_mtu is defined
      - puni_private_mtu | int >= 1280
      - puni_enrolled_private_addresses is defined
      - puni_enrolled_private_addresses | length > 0
    fail_msg: Cluster, private address/interface/MTU, and enrolled peers are required

- name: Create the fleet nftables directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render persistent private-interface MTU setup
  ansible.builtin.template:
    src: private-mtu.service.j2
    dest: /etc/systemd/system/puni-private-mtu.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart private MTU setup

- name: Start persistent private-interface MTU setup
  ansible.builtin.systemd_service:
    name: puni-private-mtu
    state: started
    enabled: true
    daemon_reload: true

- name: Render the isolated k3s firewall candidate
  ansible.builtin.template:
    src: k3s.nft.j2
    dest: '/etc/nftables.d/puni-k3s-{{ puni_cluster_id }}.nft'
    owner: root
    group: root
    mode: '0600'
  register: puni_firewall_candidate

- name: Validate the new firewall before changing active rules
  # Proof: breaking the isolated transaction made the committed firewall contract test fail before activation.
  ansible.builtin.command: >-
    unshare --net nft -c -f /etc/nftables.d/puni-k3s-{{ puni_cluster_id }}.nft
  changed_when: false

- name: Install the persistent isolated k3s firewall service
  # Proof: removing multi-user enablement made the reboot-persistence contract test fail.
  ansible.builtin.template:
    src: puni-k3s-firewall.service.j2
    dest: /etc/systemd/system/puni-k3s-firewall.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd for fleet firewall
    - Restart fleet firewall

- name: Start the persistent isolated k3s firewall
  ansible.builtin.systemd_service:
    name: puni-k3s-firewall
    state: started
    enabled: true
    daemon_reload: true

- name: Verify private-path MTU without fragmentation
  ansible.builtin.command: >-
    ping -I {{ puni_private_interface }} -M do
    -s {{ puni_private_mtu | int - 28 }} -c 1 -W 3 {{ item }}
  loop: '{{ puni_enrolled_private_addresses | difference([puni_node_ip]) }}'
  changed_when: false
