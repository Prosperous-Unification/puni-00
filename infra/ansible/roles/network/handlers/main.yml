---
- name: Reload systemd for fleet firewall
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart private MTU setup
  ansible.builtin.systemd_service:
    name: puni-private-mtu
    state: restarted
    daemon_reload: true

- name: Restart fleet firewall
  ansible.builtin.systemd_service:
    name: puni-k3s-firewall
    state: restarted
    daemon_reload: true
