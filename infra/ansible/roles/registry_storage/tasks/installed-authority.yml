---
- name: Measure existing pinned authority runtime
  ansible.builtin.stat:
    path: /usr/local/libexec/puni-registry-authority/bun
    checksum_algorithm: sha256
    follow: false
  register: registry_maintenance_runtime

- name: Refuse unverified authority runtime
  ansible.builtin.assert:
    that:
      - registry_maintenance_runtime.stat.isreg | default(false)
      - registry_maintenance_runtime.stat.uid == 0
      - registry_maintenance_runtime.stat.mode == '0755'
      - registry_maintenance_runtime.stat.checksum == '10702245766b225e70bbf6235fd6b47214fd94b4760d00ffaed8ab0df57ac235'

- name: Measure required installed authority bundle
  ansible.builtin.stat:
    path: /usr/local/libexec/puni-registry-authority/authority.js
    checksum_algorithm: sha256
    follow: false
  register: registry_maintenance_authority

- name: Refuse unverified installed authority bundle
  ansible.builtin.assert:
    that:
      - registry_maintenance_authority.stat.isreg | default(false)
      - registry_maintenance_authority.stat.uid == 0
      - registry_maintenance_authority.stat.gid == 0
      - registry_maintenance_authority.stat.nlink == 1
      - registry_maintenance_authority.stat.mode == '0644'
      - registry_maintenance_authority.stat.checksum == puni_registry_authority_bundle_sha256

- name: Measure required validated authority configuration
  ansible.builtin.stat:
    path: /etc/puni/registry-maintenance.json
    checksum_algorithm: sha256
    follow: false
  register: registry_maintenance_authority_configuration

# Proof: the real maintenance preflight rejects a differing proposal; removing only checksum binding makes that refusal test fail.
- name: Refuse differing authority configuration before staging maintenance
  ansible.builtin.assert:
    that:
      - registry_maintenance_authority_configuration.stat.isreg | default(false)
      - registry_maintenance_authority_configuration.stat.uid == 0
      - registry_maintenance_authority_configuration.stat.gid == 0
      - registry_maintenance_authority_configuration.stat.nlink == 1
      - registry_maintenance_authority_configuration.stat.mode == '0644'
      - registry_maintenance_authority_configuration.stat.checksum == (puni_registry_maintenance_configuration | to_nice_json | hash('sha256'))
    fail_msg: Stage the matching validated authority configuration with registry_authority before maintenance artifacts.

- name: Validate installed authority configuration without journal effects
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - -i
      - PATH=/usr/bin:/bin
      - /usr/local/libexec/puni-registry-authority/bun
      - /usr/local/libexec/puni-registry-authority/authority.js
      - --validate-installation
      - /etc/puni/registry-maintenance.json
  register: registry_maintenance_authority_validation
  changed_when: false

- name: Require installed authority validation acknowledgement
  ansible.builtin.assert:
    that:
      - registry_maintenance_authority_validation.stdout == 'verified'
