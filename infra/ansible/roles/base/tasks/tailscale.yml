---
# Joins a host of a separated inventory to the private access network (separate-node-roles,
# decision 12, slice 1.8). The tailnet carries the clusters' APIs and the platform interfaces,
# never SSH: Tailscale SSH stays off and sshd is reached through the bastion alone (R52, R55).
- name: Require the host's tailnet tag
  ansible.builtin.assert:
    that:
      - puni_tailscale_tag in puni_tailscale_tags
      - puni_tailscale_package_version is match('^[0-9][0-9A-Za-z.+~:-]+$')
      - puni_tailscale_repository.keyring.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: 'puni_tailscale_tag must be one of {{ puni_tailscale_tags }}'

- name: Install the locked Tailscale repository key
  ansible.builtin.get_url:
    url: '{{ puni_tailscale_repository.keyring.url }}'
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: 'sha256:{{ puni_tailscale_repository.keyring.sha256 }}'
    owner: root
    group: root
    mode: '0644'

- name: Add the Tailscale repository signed by that key alone
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] {{ puni_tailscale_repository.url }} {{ ansible_distribution_release }} main
    owner: root
    group: root
    mode: '0644'

- name: Install the locked Tailscale package
  ansible.builtin.apt:
    name: 'tailscale={{ puni_tailscale_package_version }}'
    state: present
    update_cache: true

- name: Read the installed Tailscale version
  ansible.builtin.command: tailscale version
  register: puni_tailscale_installed
  changed_when: false

- name: Require the locked Tailscale version
  ansible.builtin.assert:
    that:
      - puni_tailscale_installed.stdout_lines[0] == puni_tailscale_package_version
    fail_msg: 'Tailscale {{ puni_tailscale_installed.stdout_lines[0] }} is not the locked {{ puni_tailscale_package_version }}'

- name: Start the Tailscale daemon
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true

- name: Read the host's tailnet state before joining
  ansible.builtin.command: tailscale status --json
  register: puni_tailscale_before
  changed_when: false
  failed_when: puni_tailscale_before.rc != 0 and 'NeedsLogin' not in puni_tailscale_before.stdout

- name: Join with the single-use key from $OPS
  # A second run finds the device running and joins nothing, so it prints changed=0.
  when: (puni_tailscale_before.stdout | from_json).BackendState != 'Running'
  block:
    - name: Require the host's auth key
      ansible.builtin.assert:
        that:
          - puni_tailscale_auth_key is defined
          - puni_tailscale_auth_key is match('^tskey-auth-')
        fail_msg: A single-use tagged auth key for this host is required from $OPS
      no_log: true

    - name: Write the auth key where only root reads it
      ansible.builtin.copy:
        dest: /run/puni-tailscale-auth-key
        content: '{{ puni_tailscale_auth_key }}'
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Join the tailnet under the host's tag, without Tailscale SSH or its DNS
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - --auth-key=file:/run/puni-tailscale-auth-key
          - '--advertise-tags={{ puni_tailscale_tag }}'
          - '--hostname={{ inventory_hostname }}'
          - --ssh=false
          - --accept-dns=false
          - --accept-routes=false
      changed_when: true

  always:
    - name: Remove the spent auth key
      ansible.builtin.file:
        path: /run/puni-tailscale-auth-key
        state: absent

- name: Read the host's tailnet state after joining
  ansible.builtin.command: tailscale status --json
  register: puni_tailscale_after
  changed_when: false

- name: Require a running device with exactly the host's tag and no key expiry
  # A device tagged when it first authenticates has key expiry off by default (decision 12).
  ansible.builtin.assert:
    that:
      - (puni_tailscale_after.stdout | from_json).BackendState == 'Running'
      - (puni_tailscale_after.stdout | from_json).Self.Tags | default([]) == [puni_tailscale_tag]
      - (puni_tailscale_after.stdout | from_json).Self.KeyExpiry is not defined
    fail_msg: The device is not running under {{ puni_tailscale_tag }} alone, or its key expires
