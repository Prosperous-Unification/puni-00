---
- name: Require supported host and base security inputs
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      # 26.04 is the release of the probed h3mon and h4claw; the QEMU lab image proves it.
      - ansible_distribution_version in ['24.04', '26.04']
      - ansible_architecture in ['x86_64', 'amd64']
      - puni_operator_name is defined
      - puni_operator_name | length > 0
      - puni_operator_authorized_keys is defined
      - puni_operator_authorized_keys | length > 0
      # 0 disables every swap device; a positive size keeps exactly one fleet swap file.
      - puni_swap_file_mib is defined
      - puni_swap_file_mib | string is match('^[0-9]+$')
      - puni_machine_id is defined
      - puni_machine_id is match('^[0-9a-f]{32}$')
      # False on an adopted host, whose existing administrators keep their cloud-init grant.
      - puni_remove_cloud_init_sudoers in [true, false]
    fail_msg: >-
      Host support, operator identity, keys, the swap-file size and the cloud-init sudo policy
      are required

- name: Install host prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - chrony
      - conntrack
      - curl
      - iptables
      - jq
      - nftables
      - nfs-common
      - open-iscsi
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the fleet operator
  ansible.builtin.user:
    name: '{{ puni_operator_name }}'
    create_home: true
    shell: /bin/bash
    groups: sudo
    append: true

- name: Create the operator SSH directory
  ansible.builtin.file:
    path: '/home/{{ puni_operator_name }}/.ssh'
    state: directory
    owner: '{{ puni_operator_name }}'
    group: '{{ puni_operator_name }}'
    mode: '0700'

- name: Install the exact operator authorized keys
  ansible.builtin.copy:
    dest: '/home/{{ puni_operator_name }}/.ssh/authorized_keys'
    content: |
      {{ puni_operator_authorized_keys | join('\n') }}
    owner: '{{ puni_operator_name }}'
    group: '{{ puni_operator_name }}'
    mode: '0600'

- name: Install the operator sudo boundary
  # Proof: replacing the template newline with literal `\n` made the rendered-output visudo test fail.
  ansible.builtin.template:
    src: operator-sudoers.j2
    dest: '/etc/sudoers.d/90-{{ puni_operator_name }}-fleet'
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Remove the broad cloud-init bootstrap sudo file
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
  when: puni_remove_cloud_init_sudoers

- name: Create the journald configuration directory
  # Proof: a clean Ubuntu 24.04 VM omitted this directory and the production bootstrap exited 2
  # before the bounded journald policy could be installed.
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render bounded journald storage
  ansible.builtin.template:
    src: journald-fleet.conf.j2
    dest: /etc/systemd/journald.conf.d/50-puni-fleet.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald

- name: Render k3s kernel settings
  ansible.builtin.template:
    src: k3s-sysctl.conf.j2
    dest: /etc/sysctl.d/90-puni-k3s.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply k3s sysctls

- name: Inspect required k3s kernel modules
  ansible.builtin.stat:
    path: '/sys/module/{{ item }}'
  loop:
    - overlay
    - br_netfilter
  register: puni_k3s_modules

- name: Load required k3s kernel modules
  ansible.builtin.command: 'modprobe {{ item.item }}'
  loop: '{{ puni_k3s_modules.results }}'
  when: not item.stat.exists
  changed_when: true

- name: Persist required k3s kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/puni-k3s.conf
    content: "overlay\nbr_netfilter\n"
    owner: root
    group: root
    mode: '0644'

- name: Read active swap devices
  ansible.builtin.command: cat /proc/swaps
  register: puni_active_swap
  changed_when: false

- name: Disable every active swap device except the fleet swap file
  ansible.builtin.command: 'swapoff {{ puni_swap_device }}'
  loop: >-
    {{ puni_active_swap.stdout_lines[1:] | map('split') | map('first') | list
       | difference(['/swap.puni'] if puni_swap_file_mib | int > 0 else []) }}
  loop_control:
    loop_var: puni_swap_device
  changed_when: true

- name: Disable configured swap mounts other than the fleet swap file
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(?!/swap\.puni\s)(\S+\s+\S+\s+swap\s+.*)$'
    replace: '# puni-fleet disabled swap: \1'

- name: Inspect the fleet swap file
  ansible.builtin.stat:
    path: /swap.puni
  register: puni_swap_file

- name: Remove a fleet swap file of another size or one no longer wanted
  # Proof: without this, changing puni_swap_file_mib left the old-size file active; the lab
  # resize drill in openspec/changes/enroll-existing-hosts/verify.md observed the exact new size.
  when:
    - puni_swap_file.stat.exists
    - puni_swap_file_mib | int == 0 or puni_swap_file.stat.size != puni_swap_file_mib | int * 1048576
  block:
    - name: Deactivate the stale fleet swap file
      # With a size of 0 the loop above has already deactivated it. Proof: without the size
      # condition, 1024 to 0 on the lab agent failed here with "swapoff failed: Invalid argument".
      ansible.builtin.command: swapoff /swap.puni
      when:
        - puni_swap_file_mib | int > 0
        - "'/swap.puni' in puni_active_swap.stdout"
      changed_when: true

    - name: Delete the stale fleet swap file
      ansible.builtin.file:
        path: /swap.puni
        state: absent

- name: Remove the fleet swap mount when swap is disabled
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swap\.puni\s'
    state: absent
  when: puni_swap_file_mib | int == 0

- name: Provide the fleet swap file
  when: puni_swap_file_mib | int > 0
  block:
    - name: Allocate the fleet swap file
      ansible.builtin.command: 'fallocate --length {{ puni_swap_file_mib | int * 1048576 }} /swap.puni'
      args:
        creates: /swap.puni
      register: puni_swap_allocated

    - name: Restrict the fleet swap file to root
      ansible.builtin.file:
        path: /swap.puni
        owner: root
        group: root
        mode: '0600'

    - name: Format the new fleet swap file
      ansible.builtin.command: mkswap /swap.puni
      when: puni_swap_allocated is changed
      changed_when: true

    - name: Mount the fleet swap file at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swap\.puni\s'
        line: /swap.puni none swap sw 0 0

    - name: Read swap devices after provisioning the fleet swap file
      ansible.builtin.command: cat /proc/swaps
      register: puni_provisioned_swap
      changed_when: false

    - name: Activate the fleet swap file
      ansible.builtin.command: swapon /swap.puni
      when: "'/swap.puni' not in puni_provisioned_swap.stdout"
      changed_when: true

- name: Start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
