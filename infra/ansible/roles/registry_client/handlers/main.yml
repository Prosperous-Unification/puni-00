---
- name: Restart registry client
  ansible.builtin.systemd_service:
    name: '{{ puni_registry_service }}'
    state: restarted
  when: puni_registry_mode == 'k3s'
  notify:
    - Wait for registry server readiness
    - Wait for registry agent readiness

# Proof: registry-hosts.test.ts stalls a real kubectl API response; removing request timeout
# exceeds the request deadline, and removing process timeout permits a stuck executable to survive.
- name: Wait for registry server readiness
  ansible.builtin.command:
    argv: [timeout, --signal=KILL, 15s, k3s, kubectl, --request-timeout=5s, get, --raw=/readyz]
  register: puni_registry_ready
  changed_when: false
  until: puni_registry_ready.rc == 0 and puni_registry_ready.stdout | trim == 'ok'
  retries: 30
  delay: 2
  when: puni_registry_service == 'k3s'

- name: Wait for registry agent readiness
  ansible.builtin.command:
    argv: [systemctl, is-active, k3s-agent]
  register: puni_registry_active
  changed_when: false
  until: puni_registry_active.rc == 0 and puni_registry_active.stdout | trim == 'active'
  retries: 30
  delay: 2
  when: puni_registry_service == 'k3s-agent'
