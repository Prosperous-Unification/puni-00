---
# What `ops job run` and the `watch` unit need from the host (`dash-host-jobs` J4, J8, J12):
# a user manager that outlives logins, the fixed pool paths, the token unit, the pool
# configuration on an enrolled host, and the user units. It never runs `ops pool init` and never
# starts a unit: both are the operator's enrollment steps (task 6.4).

# `ops job run` measures a job in a `systemd-run --user` scope and refuses 70 without a user
# manager (J8); linger keeps puni1's manager running with nobody logged in.
- name: Keep the gate account's user manager running
  ansible.builtin.command:
    argv: [loginctl, enable-linger, '{{ puni_gate_user }}']
    creates: '/var/lib/systemd/linger/{{ puni_gate_user }}'

- name: Read the gate account's uid
  ansible.builtin.getent:
    database: passwd
    key: '{{ puni_gate_user }}'

# `systemctl --user` reaches the manager through this socket; linger starts the manager
# asynchronously, so the first run waits for it.
- name: Wait for the gate account's user manager
  ansible.builtin.wait_for:
    path: '/run/user/{{ ansible_facts.getent_passwd[puni_gate_user][1] }}/systemd/private'
    timeout: 60

# Only the directories Dash and systemd read; existing parents keep their mode.
- name: Create the parents of the Dash and systemd user paths
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ puni_gate_user }}'
    group: '{{ puni_gate_user }}'
  loop:
    - '{{ puni_gate_home }}/.config'
    - '{{ puni_gate_home }}/.config/systemd'
    - '{{ puni_gate_home }}/.local'
    - '{{ puni_gate_home }}/.local/share'

# Owner-only, as Dash requires of its root; the root stays empty, because `ops pool init`
# creates `.dash` itself and refuses a root that is not empty (S6C-A3).
- name: Create the owner-only Dash directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ puni_gate_user }}'
    group: '{{ puni_gate_user }}'
    mode: '0700'
  loop:
    - '{{ puni_gate_home }}/.config/dash'
    - '{{ puni_gate_home }}/.local/share/dash'
    - '{{ puni_gate_pool_root }}'
    - '{{ puni_gate_pool_units_root }}'

- name: Create the systemd user unit directory
  ansible.builtin.file:
    path: '{{ puni_gate_user_unit_directory }}'
    state: directory
    owner: '{{ puni_gate_user }}'
    group: '{{ puni_gate_user }}'
    mode: '0755'

# Each token unit is built in a sibling and renamed into place, so a run that dies midway leaves
# no half tree at the unit's path. An existing path must already be a clean tree with a commit:
# anything else refuses 70 naming it, never repaired over (S6C-A6).
# Proof: with the commit dropped, gate-host-pool.test.ts, which runs this exact argv twice and
# against a broken unit, failed (verify.md Slice 6c, 6c-F7). In the controller-image evaluator
# (infra/ansible/tests/gate-host-assertions.py, E14) the loop reduced to `dagger_engine` left no
# `docker_build` tree, and without `changed_when` a rerun reported changed=2 (verify.md, task 6.3).
- name: Create the token units
  become_user: '{{ puni_gate_user }}'
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - >-
        set -euo pipefail; unit=$1;
        if [[ -e $unit ]]; then
        if [[ $(git -C "$unit" rev-parse --show-toplevel 2>/dev/null) == "$unit" ]] &&
        git -C "$unit" rev-parse -q --verify HEAD >/dev/null &&
        [[ -z $(git -C "$unit" status --porcelain --untracked-files=all) ]]; then
        printf 'present\n'; exit 0; fi;
        printf 'token unit %s exists but is not a clean Git tree with a commit; move it aside and rerun\n' "$unit" >&2;
        exit 70; fi;
        staging=$(mktemp -d "$unit.XXXXXX");
        git -c init.defaultBranch=token init -q -- "$staging";
        git -C "$staging" -c user.name=gate_host -c user.email=gate-host@puni.invalid
        -c commit.gpgsign=false commit -q --allow-empty
        -m "${unit##*/} token unit (dash-host-jobs S6-A7)";
        mv -T -- "$staging" "$unit"; printf 'created\n'
      - token-unit
      - '{{ item }}'
  loop: '{{ puni_gate_pool_token_units }}'
  register: puni_gate_token_unit
  changed_when: puni_gate_token_unit.stdout == 'created'

# Proof: in the controller-image evaluator (infra/ansible/tests/gate-host-assertions.py, E1) this refused an undefined, non-mapping,
# extra-key, http, string-budget and zero-budget input with its own message and skipped an
# unenrolled host; each condition removed (and `when`) let its input through or lose this
# message (verify.md Slice 6c).
- name: Require the host pool inputs of an enrolled host
  vars:
    puni_gate_host_pool_fields:
      [authorityId, credential, diskBudgetUnits, epoch, mcpResource, providerId]
  ansible.builtin.assert:
    that:
      - puni_gate_host_pool is defined
      - puni_gate_host_pool is mapping
      - (puni_gate_host_pool.keys() | sort) == puni_gate_host_pool_fields
      - puni_gate_host_pool.mcpResource is match('^https://')
      - puni_gate_host_pool.diskBudgetUnits is integer
      - puni_gate_host_pool.diskBudgetUnits > 0
    fail_msg: >-
      An enrolled gate host needs puni_gate_host_pool with exactly authorityId, epoch,
      providerId, mcpResource (https), credential and an integer diskBudgetUnits, from the
      operator's $OPS file (docs/infra/gate-hosts.md, "Enroll a host in the host pool")
  when: puni_gate_host_pool_enroll

# `nproc` and MemTotal rounded down, which `ops pool init` checks the budget against; the
# headroom is subtracted by Dash (allocatable = budget - headroom).
- name: Read the host pool budget from the host facts
  ansible.builtin.set_fact:
    puni_gate_pool_cpu_cores: '{{ ansible_facts.processor_nproc }}'
    puni_gate_pool_memory_gib: '{{ ansible_facts.memtotal_mb // 1024 }}'
  when: puni_gate_host_pool_enroll

# A configuration missing beside a ledger is rewritten from the inputs, which restores a broken
# enrollment; the next open then checks it against the ledger itself.
- name: Read whether this host's pool is initialized and configured
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop: ['{{ puni_gate_pool_ledger }}', '{{ puni_gate_pool_config }}']
  register: puni_gate_pool_live
  when: puni_gate_host_pool_enroll

# Once `ops pool init` has run, the ledger pins every field but `mcpResource`, `credential`,
# `launcherCheckouts` and `concurrencyEligible` (`ResourceRuntime.binding`), and every open throws
# `resource authority binding mismatch` on any difference. A changed fact or input (headroom,
# MemTotal across a GiB boundary, a renamed inventory host) must stop the play here, before the
# template rewrites the live file (S6C-A15). The candidate goes in on stdin, never to disk, and
# the probe prints only the names of differing fields, never a value.
# Proof: with `memoryGib` dropped from the pinned list, gate-host-pool.test.ts's
# `the pinned-field probe names a changed budget, never a value` failed (verify.md Slice 6c, 6c-F15).
- name: Compare the pinned fields with the live configuration
  become_user: '{{ puni_gate_user }}'
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - >-
        jq -c --slurpfile live "$1"
        '["root", "authorityId", "epoch", "providerId", "diskUnitBytes", "diskBudgetUnits",
        "workspaceSlots", "headroomBytes", "cpuCores", "memoryGib", "headroom", "exclusiveUnits",
        "enrollmentId"] as $pinned | . as $candidate
        | [$pinned[] | select($candidate[.] != $live[0][.])]'
      - pinned-fields
      - '{{ puni_gate_pool_config }}'
    stdin: "{{ lookup('ansible.builtin.template', 'host-pool.json.j2') }}"
  register: puni_gate_pool_pinned
  changed_when: false
  failed_when: false
  no_log: true
  when: >-
    puni_gate_host_pool_enroll and puni_gate_pool_live.results[0].stat.exists and
    puni_gate_pool_live.results[1].stat.exists

# Proof: in the controller-image evaluator (infra/ansible/tests/gate-host-assertions.py, E7)
# this assertion passed `[]` and refused `["memoryGib"]` and a jq failure (rc 2, empty stdout);
# with its condition removed both got through (verify.md Slice 6c).
- name: Require the pinned fields to equal the live configuration's
  ansible.builtin.assert:
    # A jq failure (unreadable or malformed live file) prints nothing, so this one condition
    # refuses it too.
    that:
      - puni_gate_pool_pinned.stdout == '[]'
    fail_msg: >-
      pinned field differs from the ledger; re-enrollment under a new root is required
      (differing: {{ puni_gate_pool_pinned.stdout | default('') }}, rc
      {{ puni_gate_pool_pinned.rc | default('none') }}, {{ puni_gate_pool_pinned.stderr | default('') }}).
      The role leaves {{ puni_gate_pool_config }} unchanged. Revert the input; the root is fixed
      (S6-A1), so re-enrolling means retiring this ledger first, an operator decision outside
      the role (docs/infra/gate-hosts.md, "Enroll a host in the host pool")
  when: >-
    puni_gate_host_pool_enroll and puni_gate_pool_live.results[0].stat.exists and
    puni_gate_pool_live.results[1].stat.exists

# Written only when absent or different; on an initialized pool only the unpinned fields can
# differ by now. It carries the WBS credential: no_log.
- name: Write the host pool configuration
  ansible.builtin.template:
    src: host-pool.json.j2
    dest: '{{ puni_gate_pool_config }}'
    owner: '{{ puni_gate_user }}'
    group: '{{ puni_gate_user }}'
    mode: '0600'
  no_log: true
  when: puni_gate_host_pool_enroll

# The audit pair is the files `ops job render-audit-units` renders (gate-host-pool.test.ts
# compares them); the watch unit has no renderer, so its template is its only source.
- name: Install the Dash user units
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '{{ puni_gate_user_unit_directory }}/{{ item }}'
    owner: '{{ puni_gate_user }}'
    group: '{{ puni_gate_user }}'
    mode: '0644'
  loop: [dash-resources-watch.service, dash-job-audit.service, dash-job-audit.timer]
  register: puni_gate_user_units

- name: Reload the gate account's user manager
  become_user: '{{ puni_gate_user }}'
  ansible.builtin.command:
    argv: [systemctl, --user, daemon-reload]
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_facts.getent_passwd[puni_gate_user][1] }}'
  when: puni_gate_user_units is changed
  changed_when: true

# Enabled, never started: the operator starts the watch right after `ops pool init` (task 6.4).
# Not enabled on a host that is not enrolled, where the audit would fail every week.
- name: Enable the Dash user units on an enrolled host
  become_user: '{{ puni_gate_user }}'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    scope: user
    enabled: true
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_facts.getent_passwd[puni_gate_user][1] }}'
  loop: [dash-resources-watch.service, dash-job-audit.timer]
  when: puni_gate_host_pool_enroll
