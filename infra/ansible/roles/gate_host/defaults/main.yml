---
# The account name is fixed, not a preference: `resolve_heavy_lock_path` in bin/heavy-lock-lib.sh
# hard-codes `/home/puni1/.cache/wbs-heavy-work.lock` on Linux and deliberately takes no override,
# because a caller that can name its own lock can opt out of it. Naming the account `puni1` keeps
# that path, the Bun path and every gate runbook line identical to h2puni's. Each gate host still
# has its own lock: the path is per host, so h4claw's gates queue only behind h4claw's.
puni_gate_user: puni1
puni_gate_home: /home/puni1
# For a host whose gate account is also its operator and dev account and still escalates (h2puni's
# `puni1`, whose dev poller and monitoring scripts call sudo). The gate-host isolation property
# does not hold there: a gate payload can become root. Set it per host in the inventory, never
# here: a boolean extra-var would reach every host in the run, and only `--limit` would guard the
# others. Validate then requires the state the strict check would refuse (the `sudo` group or
# `sudo -n` succeeding), so a stale exception fails too. The probe is a heuristic: a
# command-limited NOPASSWD grant makes `sudo -n true` exit 1, so the strict check cannot see it.
# It is debt until the dev poller and those scripts leave `puni1` (docs/infra/gate-hosts.md,
# step 0).
puni_gate_account_may_sudo: false
# Distinct from h2puni's lane trees; one tree per host, owned by the gate account.
puni_gate_checkout: /home/puni1/puni-00-gate-tbf
puni_gate_repository_url: https://github.com/Prosperous-Unification/puni-00.git
# /tmp is a RAM-sized tmpfs on these hosts and be-01's test databases live in os.tmpdir(), which
# is why h2puni's ~/.bashrc points TMPDIR at the disk.
puni_gate_tmpdir: /var/tmp
# The pins come from the controller's reviewed checkout, never from the gate tree, whose head
# moves with every gate: reading them there would make a second run diverge.
puni_gate_repository_root: '{{ role_path }}/../../../..'
puni_gate_bun_version: "{{ lookup('ansible.builtin.file', puni_gate_repository_root + '/.bun-version') | trim }}"
puni_gate_bun_lock: "{{ (lookup('ansible.builtin.file', puni_gate_repository_root + '/infra/versions/toolchain.json') | from_json).binaries.solverBun }}"
# Nx's bin is `#!/usr/bin/env node`, so every `bun run <nx script>` needs a Node on PATH; h2puni
# has 24.18.1 (Volta), CI has the runner's. The pin lives in toolchain.json like the Bun one.
puni_gate_node_lock: "{{ (lookup('ansible.builtin.file', puni_gate_repository_root + '/infra/versions/toolchain.json') | from_json).binaries.gateNode }}"
puni_gate_node_version: '{{ puni_gate_node_lock.version }}'
# twilight-dash's activation tests run the real offline verifier at /usr/bin/gh (its bytes are the
# runtime identity they hash); h2puni has gh from GitHub's apt repository, CI the runner's. That
# repository keeps only the newest release, so the pin is the release .deb in toolchain.json.
puni_gate_gh_lock: "{{ (lookup('ansible.builtin.file', puni_gate_repository_root + '/infra/versions/toolchain.json') | from_json).binaries.gateGh }}"
puni_gate_gh_version: '{{ puni_gate_gh_lock.version }}'
puni_gate_solver_requirements: '{{ puni_gate_repository_root }}/libs/wbs/adapters/solver-py/requirements.lock'

# The second gate tree (J15) and the launcher-only checkout (docs/infra/heavy-job-launchers.md):
# an enrolled payload refuses 64 when its admitted tree is the launcher's own checkout, and a
# process working in a unit holds it, so gates, `watch` and the audit run Dash from a checkout
# that is no pool unit. All three are full clones with one frozen install, like the first.
puni_gate_second_checkout: '{{ puni_gate_home }}/puni-00-gate-tbf2'
puni_gate_launcher_checkout: '{{ puni_gate_home }}/puni-00-gate-launcher'
puni_gate_checkouts:
  - '{{ puni_gate_checkout }}'
  - '{{ puni_gate_second_checkout }}'
  - '{{ puni_gate_launcher_checkout }}'
# Free space the role requires before it clones (S6C-A4): 5 GiB per missing checkout (a clone
# plus its frozen install measured about 4.4 GB on h2puni, 2026-11-02) and 10 GiB left over,
# the `gate` type's 8 GiB tmp envelope plus margin, so a clone never leaves a host unable to gate
# (h2puni's ENOSPC gate failure of 2026-10-20).
puni_gate_clone_bytes: 5368709120
puni_gate_clone_floor_bytes: 10737418240

# The host pool (`dash-host-jobs` J4, J12). The configuration and root paths are the ones
# `resolve_host_pool_config_path` and `resolve_host_pool_root` in bin/heavy-lock-lib.sh hard-code
# (S6-A1); the configuration existing is what enrolls a host, so the role writes it only where
# `puni_gate_host_pool_enroll` is true (S6C-A2).
puni_gate_pool_config: '{{ puni_gate_home }}/.config/dash/host-pool.json'
puni_gate_pool_root: '{{ puni_gate_home }}/.local/share/dash/host-pool'
puni_gate_pool_ledger: '{{ puni_gate_pool_root }}/.dash/resources.sqlite'
# Units must be Git work trees outside the managed root (S6-A7), so an engine shared by the host
# is a token tree: one empty commit, never changed, which settlement finds clean at its resting
# commit. `docker_build` stands for the host daemon's BuildKit cache (J3): puni-pr-00's
# website-dev-build type declares it, because its three `docker build`s share that cache with
# the gate's solver smoke (release-build builds inside the Dagger engine's own cache). It serialises only the types that declare it, and this
# repository's catalogue declares it for none yet; an enrolled host refuses 73 a type naming a
# unit its pool lacks.
puni_gate_pool_units_root: '{{ puni_gate_home }}/.local/share/dash/units'
puni_gate_pool_dagger_unit: '{{ puni_gate_pool_units_root }}/dagger_engine'
puni_gate_pool_docker_build_unit: '{{ puni_gate_pool_units_root }}/docker_build'
puni_gate_pool_token_units:
  ['{{ puni_gate_pool_dagger_unit }}', '{{ puni_gate_pool_docker_build_unit }}']
puni_gate_pool_exclusive_units:
  gate_tree: ['{{ puni_gate_checkout }}', '{{ puni_gate_second_checkout }}']
  dagger_engine: ['{{ puni_gate_pool_dagger_unit }}']
  docker_build: ['{{ puni_gate_pool_docker_build_unit }}']
# Kept back from the host's `nproc` and MemTotal for everything outside host jobs (S6C-A5). The
# ledger pins it at `ops pool init`: choose it per host before then (h4claw's k3s may want more),
# because changing it afterwards stops the role (S6C-A15) and needs re-enrollment.
puni_gate_pool_headroom: { cpuCores: 1, memoryGib: 2 }
puni_gate_pool_disk_unit_bytes: 1073741824
puni_gate_pool_headroom_bytes: 10737418240
puni_gate_pool_workspace_slots: 4
# Pinned in the ledger at `ops pool init`; changing it later makes every open refuse.
puni_gate_pool_enrollment_id: '{{ inventory_hostname }}-host-pool'
# What `ops pool switch-mode concurrent` verifies; a host adds its other launcher checkouts by
# overriding the list in the inventory (h2puni adds ~/wbs-dev/src for solver-image-publish).
puni_gate_pool_launcher_checkouts: ['{{ puni_gate_launcher_checkout }}']
# Task 6.5 lists types here per host; a role run never adds one.
puni_gate_pool_concurrency_eligible: []

puni_gate_bun_path: '{{ puni_gate_home }}/.bun-{{ puni_gate_bun_version }}/bin/bun'
puni_gate_dash_entrypoint: '{{ puni_gate_launcher_checkout }}/apps/twilight-structure/twilight-dash/cli/src/entrypoint.ts'
puni_gate_user_unit_directory: '{{ puni_gate_home }}/.config/systemd/user'
puni_gate_service_path: '{{ puni_gate_home }}/.bun-{{ puni_gate_bun_version }}/bin:{{ puni_gate_home }}/.node-{{ puni_gate_node_version }}/bin:/usr/local/bin:/usr/bin:/bin'
