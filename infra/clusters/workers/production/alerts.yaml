apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerts
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/alerts/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: puni-platform
  kubeConfig:
    secretRef:
      name: workers-production-kubeconfig
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: observability
  wait: true
  timeout: 5m
