apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: target
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/target
  prune: true
  sourceRef:
    kind: GitRepository
    name: puni-platform
  kubeConfig:
    secretRef:
      name: workers-production-kubeconfig
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: v1
      kind: ConfigMap
      name: puni-cluster-workers-production
      namespace: kube-system
  timeout: 2m
