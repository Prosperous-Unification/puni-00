apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/storage/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: puni-platform
  kubeConfig:
    secretRef:
      name: workers-local-kubeconfig
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: controllers
  wait: true
  timeout: 10m
