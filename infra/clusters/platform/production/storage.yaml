apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: storage, namespace: flux-system }
spec:
  interval: 10m
  path: ./infra/platform/storage/production
  prune: true
  sourceRef: { kind: GitRepository, name: puni-platform }
  kubeConfig: { secretRef: { name: platform-production-kubeconfig } }
  decryption: { provider: sops, secretRef: { name: sops-age } }
  dependsOn: [{ name: controllers }]
  wait: true
