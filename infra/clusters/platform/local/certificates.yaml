apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/certificates/platform/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: puni-platform
  kubeConfig:
    secretRef:
      name: platform-local-kubeconfig
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: controllers
    - name: secrets
  wait: true
  timeout: 10m
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      failed: status.conditions.exists(c, c.type == 'Ready' && c.status == 'False')
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True' && c.observedGeneration == metadata.generation)
