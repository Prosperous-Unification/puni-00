apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: puni-platform
  namespace: observability
spec:
  groups:
    - name: puni-endpoints
      rules:
        - alert: PuniEndpointDown
          expr: probe_success == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: '{{ $labels.instance }} failed its blackbox probe'
    - name: puni-telemetry
      rules:
        - alert: PuniLogBacklog
          expr: max by (pod) (otelcol_exporter_queue_size{exporter="elasticsearch"}) > 20
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: '{{ $labels.pod }} is queueing logs it cannot deliver to Elasticsearch'
        - alert: PuniLogExportFailing
          expr: sum by (pod) (rate(otelcol_exporter_send_failed_log_records_total[5m])) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: '{{ $labels.pod }} fails to export logs'
        - alert: PuniLogIngestStopped
          # `or vector(0)` keeps the alert live when the collector or its series disappears.
          # Proof: the previous expression failed the vanished-series promtool case on 2026-09-18.
          expr: >-
            (sum(rate(otelcol_exporter_sent_log_records_total{exporter="elasticsearch"}[15m]))
            or vector(0)) == 0
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: No log records reached Elasticsearch for 15 minutes
    - name: puni-backups
      rules:
        # A failed sqlite-backup or sqlite-backup-verify Job alerts until a later run of the same
        # CronJob succeeds.
        # Proof: matching only owner_name="sqlite-backup" failed the restore-verification promtool
        # case on 2026-09-18.
        # Proof: the previous kube_job_failed rule failed both clear-after-success promtool cases.
        - alert: PuniBackupJobFailed
          expr: >-
            max by (namespace, owner_name) (
              (kube_job_status_start_time
                * on (namespace, job_name) group_left ()
                  (kube_job_failed{condition="true"} == 1))
              * on (namespace, job_name) group_left (owner_name)
                kube_job_owner{owner_kind="CronJob", owner_name=~"sqlite-backup|sqlite-backup-verify"}
            )
            > on (namespace, owner_name)
            (
              max by (namespace, owner_name) (
                label_replace(kube_cronjob_status_last_successful_time{cronjob=~"sqlite-backup|sqlite-backup-verify"},
                  "owner_name", "$1", "cronjob", "(.+)")
              )
              or on (namespace, owner_name)
              0 * max by (namespace, owner_name) (
                kube_job_owner{owner_kind="CronJob", owner_name=~"sqlite-backup|sqlite-backup-verify"}
              )
            )
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: 'The latest {{ $labels.namespace }}/{{ $labels.owner_name }} run failed'
        - alert: PuniElasticSnapshotJobFailed
          expr: kube_job_failed{condition="true", namespace="observability", job_name="elastic-snapshots"} == 1
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: The Elastic snapshot repository and policy job failed
        - alert: PuniSqliteBackupStale
          # Covers a CronJob that succeeded long ago and one that has never succeeded.
          # Proof: the previous expression failed the never-succeeded promtool case on 2026-09-18.
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="wbs", cronjob="sqlite-backup"}
              > 26 * 3600)
            or
            ((time() - kube_cronjob_created{namespace="wbs", cronjob="sqlite-backup"} > 26 * 3600)
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{namespace="wbs", cronjob="sqlite-backup"})
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: No successful SQLite backup for more than 26 hours
        - alert: PuniSqliteBackupSuspended
          expr: kube_cronjob_spec_suspend{namespace="wbs", cronjob="sqlite-backup"} == 1
          for: 1h
          labels: { severity: critical }
          annotations:
            summary: The SQLite backup CronJob is suspended
        - alert: PuniSqliteBackupMissing
          expr: absent(kube_cronjob_created{namespace="wbs", cronjob="sqlite-backup"})
          for: 1h
          labels: { severity: critical }
          annotations:
            summary: The SQLite backup CronJob does not exist
        - alert: PuniVeleroBackupFailed
          expr: >-
            increase(velero_backup_failure_total[1h]) > 0
            or increase(velero_backup_partial_failure_total[1h]) > 0
          labels: { severity: critical }
          annotations:
            summary: A Velero backup failed or partially failed
        - alert: PuniVeleroBackupStale
          expr: >-
            time() - velero_backup_last_successful_timestamp{schedule="velero-daily-volumes"}
            > 26 * 3600
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: No successful scheduled Velero backup for more than 26 hours
        - alert: PuniVeleroBackupNeverSucceeded
          expr: absent(velero_backup_last_successful_timestamp{schedule="velero-daily-volumes"})
          for: 26h
          labels: { severity: critical }
          annotations:
            summary: The scheduled Velero backup has never succeeded
        - alert: PuniVolumeNearlyFull
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has under 15% free'
