apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [install.yaml]
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    patch: |
      - {"op": "test", "path": "/apiVersion", "value": "apps/v1"}
      - {"op": "test", "path": "/kind", "value": "Deployment"}
      - {"op": "test", "path": "/metadata/name", "value": "source-controller"}
      - {"op": "test", "path": "/metadata/namespace", "value": "flux-system"}
      - {"op": "test", "path": "/spec/template/spec/containers/0/name", "value": "manager"}
      - {"op": "test", "path": "/spec/template/spec/volumes", "value": [{"name": "data", "emptyDir": {}}, {"name": "tmp", "emptyDir": {}}]}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/requests/ephemeral-storage", "value": "2Gi"}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/limits/ephemeral-storage", "value": "2304Mi"}
      - {"op": "add", "path": "/spec/template/spec/volumes/0/emptyDir/sizeLimit", "value": "1Gi"}
      - {"op": "add", "path": "/spec/template/spec/volumes/1/emptyDir/sizeLimit", "value": "1Gi"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    patch: |
      - {"op": "test", "path": "/apiVersion", "value": "apps/v1"}
      - {"op": "test", "path": "/kind", "value": "Deployment"}
      - {"op": "test", "path": "/metadata/name", "value": "kustomize-controller"}
      - {"op": "test", "path": "/metadata/namespace", "value": "flux-system"}
      - {"op": "test", "path": "/spec/template/spec/containers/0/name", "value": "manager"}
      - {"op": "test", "path": "/spec/template/spec/volumes", "value": [{"name": "temp", "emptyDir": {}}]}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/requests/ephemeral-storage", "value": "1Gi"}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/limits/ephemeral-storage", "value": "1280Mi"}
      - {"op": "add", "path": "/spec/template/spec/volumes/0/emptyDir/sizeLimit", "value": "1Gi"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    patch: |
      - {"op": "test", "path": "/apiVersion", "value": "apps/v1"}
      - {"op": "test", "path": "/kind", "value": "Deployment"}
      - {"op": "test", "path": "/metadata/name", "value": "helm-controller"}
      - {"op": "test", "path": "/metadata/namespace", "value": "flux-system"}
      - {"op": "test", "path": "/spec/template/spec/containers/0/name", "value": "manager"}
      - {"op": "test", "path": "/spec/template/spec/volumes", "value": [{"name": "temp", "emptyDir": {}}]}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/requests/ephemeral-storage", "value": "256Mi"}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/limits/ephemeral-storage", "value": "384Mi"}
      - {"op": "add", "path": "/spec/template/spec/volumes/0/emptyDir/sizeLimit", "value": "256Mi"}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
    patch: |
      - {"op": "test", "path": "/apiVersion", "value": "apps/v1"}
      - {"op": "test", "path": "/kind", "value": "Deployment"}
      - {"op": "test", "path": "/metadata/name", "value": "notification-controller"}
      - {"op": "test", "path": "/metadata/namespace", "value": "flux-system"}
      - {"op": "test", "path": "/spec/template/spec/containers/0/name", "value": "manager"}
      - {"op": "test", "path": "/spec/template/spec/volumes", "value": [{"name": "temp", "emptyDir": {}}]}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/requests/ephemeral-storage", "value": "16Mi"}
      - {"op": "add", "path": "/spec/template/spec/containers/0/resources/limits/ephemeral-storage", "value": "64Mi"}
      - {"op": "add", "path": "/spec/template/spec/volumes/0/emptyDir/sizeLimit", "value": "16Mi"}
