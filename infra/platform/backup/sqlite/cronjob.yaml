# Application-consistent SQLite backup: VACUUM INTO, integrity and foreign-key checks, migration
# set, versioned upload and report. A filesystem copy of the live database never replaces it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqlite-backup
  namespace: wbs
spec:
  schedule: '17 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            puni.dev/workload: sqlite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # The database volume is ReadWriteOnce, so the job runs beside the backend that owns it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: be-01
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: docker.io/oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
              command: [bun, /runner/backup-sqlite.ts, backup]
              env:
                - { name: BACKUP_DATABASE_NAME, value: wbs }
                - { name: BACKUP_DATABASE_PATH, value: /data/wbs.db }
                - { name: BACKUP_SCRATCH_DIRECTORY, value: /scratch }
                - { name: BACKUP_PREFIX, value: sqlite }
                - { name: HOME, value: /scratch }
                - { name: TMPDIR, value: /scratch }
                - { name: BUN_RUNTIME_TRANSPILER_CACHE_PATH, value: '0' }
                - name: PUNI_SOURCE_REVISION
                  valueFrom:
                    configMapKeyRef: { name: wbs-release, key: revision }
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: endpoint }
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: bucket }
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: region }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: access-key-id }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: sqlite-backup-s3, key: secret-access-key }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: '1', memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: scratch, mountPath: /scratch }
                - { name: runner, mountPath: /runner, readOnly: true }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: wbs-data }
            - name: scratch
              emptyDir: { sizeLimit: 4Gi }
            - name: runner
              configMap: { name: sqlite-backup-runner }
