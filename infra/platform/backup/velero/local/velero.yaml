apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: puni-backup
spec:
  interval: 30m
  chart:
    spec:
      chart: ./infra/platform/charts/velero-12.2.0.tgz
      version: 12.2.0
      sourceRef:
        kind: GitRepository
        name: puni-platform
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: velero
              namespace: puni-backup
            patch: |
              - op: test
                path: /spec/template/spec/volumes
                value:
                  - name: cloud-credentials
                    secret: { secretName: velero-credentials }
                  - name: plugins
                    emptyDir: {}
                  - name: scratch
                    emptyDir: {}
              - op: add
                path: /spec/template/spec/volumes/1/emptyDir/sizeLimit
                value: 256Mi
              - op: add
                path: /spec/template/spec/volumes/2/emptyDir/sizeLimit
                value: 1Gi
  # File-system backup only: hcloud volumes have no snapshots, and databases use their own
  # application-consistent paths (SQLite VACUUM INTO, Elastic SLM).
  values:
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2
      digest: sha256:37396519f399536e5f01427d723565ae69294ec3fb5625cf1c87c09eaa9de16b
    upgradeCRDs: false
    initContainers:
      - name: velero-plugin-for-aws
        image: docker.io/velero/velero-plugin-for-aws:v1.14.1@sha256:1493a0039cd5cb31004cfbb52f8a1990bc0ed81497ce72516bc76fa9e21506c1
        volumeMounts:
          - mountPath: /target
            name: plugins
        resources:
          requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 16Mi }
          limits: { cpu: '1', memory: 256Mi, ephemeral-storage: 128Mi }
    credentials:
      useSecret: true
      existingSecret: velero-credentials
    snapshotsEnabled: false
    deployNodeAgent: true
    configuration:
      uploaderType: kopia
      defaultVolumesToFsBackup: false
      backupStorageLocation: []
    extraObjects:
      - apiVersion: velero.io/v1
        kind: BackupStorageLocation
        metadata:
          name: default
          namespace: puni-backup
        spec:
          provider: aws
          default: true
          objectStorage:
            bucket: puni-velero
            caCertRef: { name: object-store-ca, key: ca.crt }
          config:
            region: local
            s3ForcePathStyle: 'true'
            s3Url: https://object-store.puni-backup.svc:9000
    resources:
      requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi }
      limits: { cpu: '1', memory: 512Mi, ephemeral-storage: 1Gi }
    nodeAgent:
      useScratchEmptyDir: false
      extraVolumes:
        - name: scratch
          emptyDir: { sizeLimit: 1Gi }
      extraVolumeMounts:
        - { name: scratch, mountPath: /scratch }
      resources:
        requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi }
        limits: { cpu: '1', memory: 1Gi, ephemeral-storage: 2Gi }
      tolerations:
        - operator: Exists
    metrics:
      serviceMonitor:
        enabled: true
    schedules:
      daily-volumes:
        schedule: '0 2 * * *'
        template:
          ttl: 720h
          includedNamespaces: [puni-registry]
          defaultVolumesToFsBackup: true
          snapshotVolumes: false
