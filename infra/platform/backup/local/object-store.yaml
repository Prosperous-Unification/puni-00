# Local rehearsal S3 target only. Production uses provider object storage with versioned buckets
# and a separately retained off-region copy (docs/infra/recovery.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-store
  namespace: puni-backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-store
  namespace: puni-backup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: object-store }
  template:
    metadata:
      labels: { app.kubernetes.io/name: object-store }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, /data]
          envFrom:
            - secretRef: { name: object-store-root }
          ports: [{ name: s3, containerPort: 9000 }]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: object-store }
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: puni-backup
spec:
  selector: { app.kubernetes.io/name: object-store }
  ports: [{ name: s3, port: 9000, targetPort: s3 }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-buckets
  namespace: puni-backup
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: buckets
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          command:
            - sh
            - -ec
            - |
              mc alias set store http://object-store.puni-backup.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              for bucket in puni-velero puni-es-snapshots puni-sqlite puni-etcd; do
                mc mb --ignore-existing "store/$bucket"
                mc version enable "store/$bucket"
              done
          env:
            - { name: MC_CONFIG_DIR, value: /tmp/mc }
          envFrom:
            - secretRef: { name: object-store-root }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
