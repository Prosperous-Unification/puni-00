apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlite-backup-egress
  namespace: wbs
spec:
  podSelector:
    matchLabels:
      puni.dev/workload: sqlite-backup
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: puni-backup
      ports:
        - { protocol: TCP, port: 9000 }
