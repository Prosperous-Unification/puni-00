apiVersion: v1
kind: Namespace
metadata:
  name: wbs
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: workers
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: wbs-solver
  labels:
    puni.dev/trusted-hostpath: solver
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: puni-forge
  labels:
    puni.dev/trusted-hostpath: source
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bounded-workloads
  namespace: workers
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 16Gi
    limits.cpu: '16'
    limits.memory: 24Gi
    pods: '40'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: workers
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wbs-backend
  namespace: wbs-solver
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-environment-controller
  namespace: puni-forge
automountServiceAccountToken: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: puni-registry
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# node-exporter needs the host network and PID namespaces and the log collector reads
# /var/log/pods; only platform controllers deploy here.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
# Velero's node agent reads pod volumes through /var/lib/kubelet/pods.
apiVersion: v1
kind: Namespace
metadata:
  name: puni-backup
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
