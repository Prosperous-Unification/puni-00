apiVersion: batch/v1
kind: Job
metadata: { name: allowed-egress, namespace: workers }
spec:
  backoffLimit: 0
  template:
    metadata: { labels: { puni.dev/workload: worker } }
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: probe
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            [
              sh,
              -c,
              'test "$(wget -T 5 -qO- http://allowed-receiver.observability.svc.cluster.local:4317)" = telemetry-ok',
            ]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: denied-egress, namespace: workers }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 20
  template:
    metadata: { labels: { puni.dev/workload: worker } }
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: probe
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: [wget, -T, '5', -qO-, 'http://denied-receiver.wbs.svc.cluster.local:8080']
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
