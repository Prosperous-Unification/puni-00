apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: puni-forge
      labels:
        pod-security.kubernetes.io/enforce: privileged
        puni.dev/trusted-hostpath: source
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: dev-environment-controller
      namespace: puni-forge
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: puni-forge-alpha
      labels:
        pod-security.kubernetes.io/enforce: privileged
        puni.dev/trusted-hostpath: source
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: dev-environment-controller
      namespace: puni-forge-alpha
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: puni-forge-beta
      labels:
        pod-security.kubernetes.io/enforce: privileged
        puni.dev/trusted-hostpath: source
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: dev-environment-controller
      namespace: puni-forge-beta
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: wbs-solver
      labels:
        pod-security.kubernetes.io/enforce: privileged
        puni.dev/trusted-hostpath: solver
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: wbs-backend
      namespace: wbs-solver
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: ordinary-restricted
      labels:
        pod-security.kubernetes.io/enforce: restricted
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: dev-environment-controller
      namespace: ordinary-restricted
