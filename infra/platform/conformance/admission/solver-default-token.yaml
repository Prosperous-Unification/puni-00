apiVersion: v1
kind: Pod
metadata:
  name: token-solver
  namespace: wbs-solver
  labels:
    puni.dev/controller: wbs-backend
spec:
  serviceAccountName: wbs-backend
  nodeSelector:
    puni.dev/capability-product: 'true'
  containers:
    - name: backend
      image: registry.puni.test/wbs-be@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: solver
          mountPath: /run/puni/solver
  volumes:
    - name: solver
      hostPath:
        path: /run/puni/solver
        type: Directory
