apiVersion: v1
kind: Pod
metadata:
  name: untrusted-solver
  namespace: wbs-solver
  labels:
    puni.dev/controller: wbs-backend
spec:
  serviceAccountName: default
  automountServiceAccountToken: false
  nodeSelector:
    puni.dev/capability-product: 'true'
  restartPolicy: Never
  containers:
    - name: backend
      image: registry.puni.test/wbs-be@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      command: [sleep, '1']
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
