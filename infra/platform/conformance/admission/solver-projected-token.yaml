apiVersion: v1
kind: Pod
metadata:
  name: projected-token-solver
  namespace: wbs-solver
  labels:
    puni.dev/controller: wbs-backend
spec:
  serviceAccountName: wbs-backend
  automountServiceAccountToken: false
  nodeSelector:
    puni.dev/capability-product: 'true'
  restartPolicy: Never
  containers:
    - name: backend
      image: registry.puni.test/wbs-be@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      command: [sleep, '1']
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
      volumeMounts:
        - { name: solver, mountPath: /run/puni/solver }
        - name: api-token
          mountPath: /var/run/secrets/puni
  volumes:
    - name: solver
      hostPath: { path: /run/puni/solver, type: Directory }
    - name: api-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
