# promtool unit tests for infra/platform/alerts/base/rules.yaml; run with
# `bun tools/tool-fleet/src/platform-alerts.ts`.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: log ingest alert fires when the collector series vanish
    interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: PuniLogIngestStopped
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: No log records reached Elasticsearch for 15 minutes

  - name: log ingest alert stays quiet while records flow
    interval: 1m
    input_series:
      # The collector's counters carry no `_total` suffix as Prometheus stores them (k3d, 2026-10-12).
      - series: 'otelcol_exporter_sent_log_records{exporter="elasticsearch",pod="c"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: PuniLogIngestStopped
        exp_alerts: []

  # A counter the collector creates on its first failure arrives already incremented, so
  # `increase` alone sees no change for the first dropped batch.
  - name: the first dropped batch alerts although its counter appears already incremented
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="elasticsearch",pod="c"}'
        values: '_x10 49x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: PuniLogRecordsDropped
        exp_alerts:
          - exp_labels: { severity: critical, pod: c }
            exp_annotations:
              summary: c dropped log records it could not deliver to Elasticsearch
      - eval_time: 25m
        alertname: PuniLogRecordsDropped
        exp_alerts: []

  - name: a later dropped batch alerts again
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="elasticsearch",pod="c"}'
        values: '49x20 98x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: PuniLogRecordsDropped
        exp_alerts: []
      - eval_time: 22m
        alertname: PuniLogRecordsDropped
        exp_alerts:
          - exp_labels: { severity: critical, pod: c }
            exp_annotations:
              summary: c dropped log records it could not deliver to Elasticsearch

  - name: an old drop on one pod does not hide a new drop on another
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="elasticsearch",pod="c"}'
        values: '49x80'
      - series: 'otelcol_exporter_send_failed_log_records{exporter="elasticsearch",pod="d"}'
        values: '10x70 60x10'
    alert_rule_test:
      - eval_time: 72m
        alertname: PuniLogRecordsDropped
        exp_alerts:
          - exp_labels: { severity: critical, pod: d }
            exp_annotations:
              summary: d dropped log records it could not deliver to Elasticsearch

  - name: a scrape gap does not replay an old drop
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="elasticsearch",pod="c"}'
        values: '49x30 _x10 49x20'
    alert_rule_test:
      - eval_time: 42m
        alertname: PuniLogRecordsDropped
        exp_alerts: []

  - name: a backlog the queue absorbs drops nothing
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{exporter="elasticsearch",data_type="logs",pod="c"}'
        values: '0 0 20 40 60 80 60 40 20 0x10'
      - series: 'otelcol_exporter_sent_log_records{exporter="elasticsearch",pod="c"}'
        values: '0+10x2 20x6 30+10x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: PuniLogRecordsDropped
        exp_alerts: []

  - name: a full persistent queue alerts while it stays full
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{exporter="elasticsearch",data_type="logs",pod="c"}'
        values: '0+500x9 5000x10 4000x5'
      - series: 'otelcol_exporter_queue_capacity{exporter="elasticsearch",data_type="logs",pod="c"}'
        values: '5000x24'
      - series: 'otelcol_exporter_queue_size{exporter="prometheusremotewrite",data_type="metrics",pod="c"}'
        values: '10000x24'
      - series: 'otelcol_exporter_queue_capacity{exporter="prometheusremotewrite",data_type="metrics",pod="c"}'
        values: '10000x24'
    alert_rule_test:
      - eval_time: 9m
        alertname: PuniLogQueueFull
        exp_alerts: []
      - eval_time: 12m
        alertname: PuniLogQueueFull
        exp_alerts:
          - exp_labels: { severity: critical, pod: c }
            exp_annotations:
              summary: c stopped reading logs because its Elasticsearch queue is full
      - eval_time: 22m
        alertname: PuniLogQueueFull
        exp_alerts: []

  - name: a failed backup run alerts until a later run succeeds
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="wbs-solver",job_name="sqlite-backup-1"}'
        values: '100x40'
      - series: 'kube_job_failed{namespace="wbs-solver",job_name="sqlite-backup-1",condition="true"}'
        values: '1x40'
      - series: 'kube_job_owner{namespace="wbs-solver",job_name="sqlite-backup-1",owner_kind="CronJob",owner_name="sqlite-backup",owner_is_controller="true"}'
        values: '1x40'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '_x20 200x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PuniBackupJobFailed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs-solver, owner_name: sqlite-backup }
            exp_annotations:
              summary: The latest wbs-solver/sqlite-backup run failed
      - eval_time: 30m
        alertname: PuniBackupJobFailed
        exp_alerts: []

  - name: a failed restore verification alerts even while backups succeed
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="wbs-solver",job_name="sqlite-backup-verify-1"}'
        values: '300x20'
      - series: 'kube_job_failed{namespace="wbs-solver",job_name="sqlite-backup-verify-1",condition="true"}'
        values: '1x20'
      - series: 'kube_job_owner{namespace="wbs-solver",job_name="sqlite-backup-verify-1",owner_kind="CronJob",owner_name="sqlite-backup-verify",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '400x20'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs-solver",cronjob="sqlite-backup-verify"}'
        values: '200x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PuniBackupJobFailed
        exp_alerts:
          - exp_labels:
              { severity: critical, namespace: wbs-solver, owner_name: sqlite-backup-verify }
            exp_annotations:
              summary: The latest wbs-solver/sqlite-backup-verify run failed

  - name: a failure after an earlier success alerts
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="wbs-solver",job_name="sqlite-backup-2"}'
        values: '300x20'
      - series: 'kube_job_failed{namespace="wbs-solver",job_name="sqlite-backup-2",condition="true"}'
        values: '1x20'
      - series: 'kube_job_owner{namespace="wbs-solver",job_name="sqlite-backup-2",owner_kind="CronJob",owner_name="sqlite-backup",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '200x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PuniBackupJobFailed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs-solver, owner_name: sqlite-backup }
            exp_annotations:
              summary: The latest wbs-solver/sqlite-backup run failed

  - name: sqlite backup never succeeded or suspended
    # Four-minute samples stay inside the five-minute lookback, so `for:` holds across them.
    interval: 4m
    input_series:
      - series: 'kube_cronjob_created{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '0x440'
      - series: 'kube_cronjob_spec_suspend{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '1x440'
    alert_rule_test:
      - eval_time: 28h
        alertname: PuniSqliteBackupStale
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs-solver, cronjob: sqlite-backup }
            exp_annotations:
              summary: No successful SQLite backup for more than 26 hours
      - eval_time: 3h
        alertname: PuniSqliteBackupSuspended
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs-solver, cronjob: sqlite-backup }
            exp_annotations:
              summary: The SQLite backup CronJob is suspended

  - name: sqlite backup succeeded recently
    # Four-minute samples stay inside the five-minute lookback, so `for:` holds across them.
    interval: 4m
    input_series:
      - series: 'kube_cronjob_created{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '0x440'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '0+240x440'
      - series: 'kube_cronjob_spec_suspend{namespace="wbs-solver",cronjob="sqlite-backup"}'
        values: '0x440'
    alert_rule_test:
      - eval_time: 28h
        alertname: PuniSqliteBackupStale
        exp_alerts: []

  - name: velero partial failure and staleness
    # Four-minute samples stay inside the five-minute lookback, so `for:` holds across them.
    interval: 4m
    input_series:
      - series: 'velero_backup_partial_failure_total{schedule="velero-daily-volumes"}'
        values: '0x20 1x420'
      - series: 'velero_backup_failure_total{schedule="velero-daily-volumes"}'
        values: '0x440'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-daily-volumes"}'
        values: '0x440'
    alert_rule_test:
      - eval_time: 90m
        alertname: PuniVeleroBackupFailed
        exp_alerts:
          - exp_labels: { severity: critical, schedule: velero-daily-volumes }
            exp_annotations:
              summary: A Velero backup failed or partially failed
      - eval_time: 28h
        alertname: PuniVeleroBackupStale
        exp_alerts:
          - exp_labels: { severity: critical, schedule: velero-daily-volumes }
            exp_annotations:
              summary: No successful scheduled Velero backup for more than 26 hours

  - name: workers vanish
    interval: 1m
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniWorkersTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              puni_cluster: workers-local
              k8s_namespace_name: observability
            exp_annotations:
              summary: Workers host telemetry is missing for 10 minutes
  - name: foreign workers cannot silence
    interval: 1m
    input_series:
      - series: system_memory_usage_bytes{puni_cluster="workers-production",k8s_namespace_name="observability"}
        values: 1x60
      - series: system_memory_usage_bytes{puni_cluster="workers-local",k8s_namespace_name="wrong"}
        values: 1x60
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniWorkersTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              puni_cluster: workers-local
              k8s_namespace_name: observability
            exp_annotations:
              summary: Workers host telemetry is missing for 10 minutes
  - name: expected workers are healthy
    interval: 1m
    input_series:
      - series: system_memory_usage_bytes{puni_cluster="workers-local",k8s_namespace_name="observability"}
        values: 1x60
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniWorkersTelemetryMissing
        exp_alerts: []
  - name: snapshot validator missing
    interval: 1m
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniElasticSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
              puni_cluster: platform-local
              namespace: observability
              cronjob: elastic-snapshot-check
            exp_annotations:
              summary: No recent successful Elastic snapshot freshness check
  - name: snapshot validation stale
    interval: 1m
    input_series:
      - series: kube_cronjob_status_last_successful_time{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: 1x60
      - series: kube_cronjob_created{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniElasticSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
              puni_cluster: platform-local
              namespace: observability
              cronjob: elastic-snapshot-check
            exp_annotations:
              summary: No recent successful Elastic snapshot freshness check
  - name: foreign snapshot cannot silence
    interval: 1m
    input_series:
      - series: kube_cronjob_status_last_successful_time{puni_cluster="platform-production",namespace="observability",cronjob="elastic-snapshot-check"}
        values: 3000x60
      - series: kube_cronjob_created{puni_cluster="platform-production",namespace="observability",cronjob="elastic-snapshot-check"}
        values: '0x60'
      - series: kube_cronjob_created{puni_cluster="platform-local",namespace="wrong",cronjob="elastic-snapshot-check"}
        values: '0x60'
      - series: kube_cronjob_status_last_successful_time{puni_cluster="platform-local",namespace="wrong",cronjob="elastic-snapshot-check"}
        values: 3000x60
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniElasticSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
              puni_cluster: platform-local
              namespace: observability
              cronjob: elastic-snapshot-check
            exp_annotations:
              summary: No recent successful Elastic snapshot freshness check
  - name: snapshot check healthy
    interval: 1m
    input_series:
      - series: kube_cronjob_status_last_successful_time{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: 3000x60
      - series: kube_cronjob_created{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniElasticSnapshotStale
        exp_alerts: []
  - name: snapshot never checked
    interval: 1m
    input_series:
      - series: kube_cronjob_created{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniElasticSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: critical
              puni_cluster: platform-local
              namespace: observability
              cronjob: elastic-snapshot-check
            exp_annotations:
              summary: No recent successful Elastic snapshot freshness check
  - name: workers heartbeat returns and clears
    interval: 1m
    input_series:
      - series: system_memory_usage_bytes{puni_cluster="workers-local",k8s_namespace_name="observability"}
        values: 1x5 stale _x29 1x25
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniWorkersTelemetryMissing
        exp_alerts: []
  - name: snapshot check resumes and clears
    interval: 1m
    input_series:
      - series: kube_cronjob_created{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: '0x60'
      - series: kube_cronjob_status_last_successful_time{puni_cluster="platform-local",namespace="observability",cronjob="elastic-snapshot-check"}
        values: 1x42 2600x18
    alert_rule_test:
      - eval_time: 50m
        alertname: PuniElasticSnapshotStale
        exp_alerts: []
