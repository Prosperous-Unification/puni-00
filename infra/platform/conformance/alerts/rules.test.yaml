# promtool unit tests for infra/platform/alerts/base/rules.yaml; run with
# `bun tools/tool-fleet/src/platform-alerts.ts`.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: log ingest alert fires when the collector series vanish
    interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: PuniLogIngestStopped
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: No log records reached Elasticsearch for 15 minutes

  - name: log ingest alert stays quiet while records flow
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_sent_log_records_total{exporter="elasticsearch",pod="c"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: PuniLogIngestStopped
        exp_alerts: []

  - name: a failed backup run alerts until a later run succeeds
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="wbs",job_name="sqlite-backup-1"}'
        values: '100x40'
      - series: 'kube_job_failed{namespace="wbs",job_name="sqlite-backup-1",condition="true"}'
        values: '1x40'
      - series: 'kube_job_owner{namespace="wbs",job_name="sqlite-backup-1",owner_kind="CronJob",owner_name="sqlite-backup",owner_is_controller="true"}'
        values: '1x40'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs",cronjob="sqlite-backup"}'
        values: '_x20 200x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PuniBackupJobFailed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs, owner_name: sqlite-backup }
            exp_annotations:
              summary: The latest wbs/sqlite-backup run failed
      - eval_time: 30m
        alertname: PuniBackupJobFailed
        exp_alerts: []

  - name: a failure after an earlier success alerts
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="wbs",job_name="sqlite-backup-2"}'
        values: '300x20'
      - series: 'kube_job_failed{namespace="wbs",job_name="sqlite-backup-2",condition="true"}'
        values: '1x20'
      - series: 'kube_job_owner{namespace="wbs",job_name="sqlite-backup-2",owner_kind="CronJob",owner_name="sqlite-backup",owner_is_controller="true"}'
        values: '1x20'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs",cronjob="sqlite-backup"}'
        values: '200x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: PuniBackupJobFailed
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs, owner_name: sqlite-backup }
            exp_annotations:
              summary: The latest wbs/sqlite-backup run failed

  - name: sqlite backup never succeeded or suspended
    # Four-minute samples stay inside the five-minute lookback, so `for:` holds across them.
    interval: 4m
    input_series:
      - series: 'kube_cronjob_created{namespace="wbs",cronjob="sqlite-backup"}'
        values: '0x440'
      - series: 'kube_cronjob_spec_suspend{namespace="wbs",cronjob="sqlite-backup"}'
        values: '1x440'
    alert_rule_test:
      - eval_time: 28h
        alertname: PuniSqliteBackupStale
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs, cronjob: sqlite-backup }
            exp_annotations:
              summary: No successful SQLite backup for more than 26 hours
      - eval_time: 3h
        alertname: PuniSqliteBackupSuspended
        exp_alerts:
          - exp_labels: { severity: critical, namespace: wbs, cronjob: sqlite-backup }
            exp_annotations:
              summary: The SQLite backup CronJob is suspended

  - name: sqlite backup succeeded recently
    # Four-minute samples stay inside the five-minute lookback, so `for:` holds across them.
    interval: 4m
    input_series:
      - series: 'kube_cronjob_created{namespace="wbs",cronjob="sqlite-backup"}'
        values: '0x440'
      - series: 'kube_cronjob_status_last_successful_time{namespace="wbs",cronjob="sqlite-backup"}'
        values: '0+240x440'
      - series: 'kube_cronjob_spec_suspend{namespace="wbs",cronjob="sqlite-backup"}'
        values: '0x440'
    alert_rule_test:
      - eval_time: 28h
        alertname: PuniSqliteBackupStale
        exp_alerts: []

  - name: velero partial failure and staleness
    # Four-minute samples stay inside the five-minute lookback, so `for:` holds across them.
    interval: 4m
    input_series:
      - series: 'velero_backup_partial_failure_total{schedule="velero-daily-volumes"}'
        values: '0x20 1x420'
      - series: 'velero_backup_failure_total{schedule="velero-daily-volumes"}'
        values: '0x440'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-daily-volumes"}'
        values: '0x440'
    alert_rule_test:
      - eval_time: 90m
        alertname: PuniVeleroBackupFailed
        exp_alerts:
          - exp_labels: { severity: critical, schedule: velero-daily-volumes }
            exp_annotations:
              summary: A Velero backup failed or partially failed
      - eval_time: 28h
        alertname: PuniVeleroBackupStale
        exp_alerts:
          - exp_labels: { severity: critical, schedule: velero-daily-volumes }
            exp_annotations:
              summary: No successful scheduled Velero backup for more than 26 hours
