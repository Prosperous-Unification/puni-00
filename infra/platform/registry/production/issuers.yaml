# The registry CA key pair comes from the SOPS secrets stage so that a cold rebuild keeps the
# certificate chain nodes and Dagger already trust.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: registry-ca
  namespace: puni-registry
spec:
  ca: { secretName: registry-ca }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-tls
  namespace: puni-registry
spec:
  secretName: registry-tls
  duration: 2160h
  dnsNames:
    - registry.puni.internal
    - registry.puni-registry.svc
    - registry.puni-registry.svc.cluster.local
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { kind: Issuer, name: registry-ca }
---
# Staging ACME only. A production issuer is added after staging issuance for the explicit
# hostnames in docs/infra/platform.md succeeds.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@bulletpoints.club
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }
        selector:
          dnsNames:
            - wbs-staging.bulletpoints.club
            - wbs.bulletpoints.club
