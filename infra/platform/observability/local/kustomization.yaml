apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - telemetry.yaml
  - otlp-ingress.yaml
  - receiver.yaml
configMapGenerator:
  - name: signal-configuration
    namespace: observability
    files:
      - collector.yaml
      - gateway.yaml
      - retention.json
      - logs-policy.json
      - logs-template.json
      - traces-policy.json
      - traces-template.json
      - metrics-policy.json
      - metrics-template.json
      - apply.sh
patches:
  - target:
      kind: HelmRelease
      name: elasticsearch
    patch: |-
      - op: replace
        path: /spec/values/nodeSets/0/config/s3.client.default.endpoint
        value: "object-store.puni-backup.svc:9000"
      - op: replace
        path: /spec/values/nodeSets/0/config/s3.client.default.protocol
        value: "http"
      - op: replace
        path: /spec/values/nodeSets/0/podTemplate/spec/containers/0/env/0/value
        value: "-Xms1g -Xmx1g"
      - op: replace
        path: /spec/values/nodeSets/0/podTemplate/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/values/nodeSets/0/podTemplate/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/values/nodeSets/0/volumeClaimTemplates/0/spec/resources/requests/storage
        value: "10Gi"
