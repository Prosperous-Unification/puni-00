  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels:
              operator.prometheus.io/name: kps-prometheus
      ports:
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 8889
    - from:
        - ipBlock:
            cidr: 172.31.100.2/32
      ports:
        - protocol: TCP
          port: 4318
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: signal-gateway
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 14317
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels:
              app.kubernetes.io/name: signal-metrics
      ports:
        - protocol: TCP
          port: 8443
---
