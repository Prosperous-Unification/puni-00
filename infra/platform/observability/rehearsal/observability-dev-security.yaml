apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signal-discovery
  namespace: observability-dev
rules:
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signal-discovery
  namespace: observability-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: signal-discovery
subjects:
  - kind: ServiceAccount
    name: kps-prometheus
    namespace: observability-dev
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: observability-dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager
  namespace: observability-dev
spec:
  podSelector:
    matchLabels: &a1
      alertmanager: kps-alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels: &a2
              operator.prometheus.io/name: kps-prometheus
      ports:
        - protocol: TCP
          port: 9093
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels: *a1
      ports: &a3
        - protocol: TCP
          port: 9094
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels: *a1
      ports: &a4
        - protocol: UDP
          port: 9094
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels: *a2
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels: *a1
      ports: *a3
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-dev
          podSelector:
            matchLabels: *a1
      ports: *a4
    - to:
        - ipBlock:
            cidr: 172.31.100.5/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector
  namespace: observability-dev
