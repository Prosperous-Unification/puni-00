# Local rehearsal receiver: records every Alertmanager webhook body to its log. Production routes
# come from the alertmanager-puni secret and never point here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alert-receiver }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alert-receiver }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: receiver
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/www/cgi-bin
              cat > /tmp/www/cgi-bin/alert <<'SCRIPT'
              #!/bin/sh
              body=$(head -c "${CONTENT_LENGTH:-0}")
              echo "alert-received $(date -u +%Y-%m-%dT%H:%M:%SZ) $body" >> /tmp/alerts.log
              echo "alert-received $body" > /proc/1/fd/1
              printf 'Content-Type: text/plain\r\n\r\nok\n'
              SCRIPT
              chmod 0755 /tmp/www/cgi-bin/alert
              exec httpd -f -p 8080 -h /tmp/www
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: scratch, mountPath: /tmp }]
      volumes: [{ name: scratch, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: alert-receiver }
  ports: [{ name: http, port: 8080, targetPort: http }]
