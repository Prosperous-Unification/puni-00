apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-configuration-043cff9e01ea41224f6a44bcded892aa57a82a01f4e51b1343b478454ac9d81a
  namespace: observability-dev
data:
  collector.yaml: >
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/queue:
        directory: /var/lib/otelcol/queue
        create_directory: true
        timeout: 5s
      file_storage/checkpoints:
        directory: /var/lib/otelcol/checkpoints
        create_directory: true
      basicauth/metrics:
        client_auth:
          username: writer
          password_file: /trust/metrics/password
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 1048576
            tls:
              cert_file: /trust/server/tls.crt
              key_file: /trust/server/tls.key
              client_ca_file: /trust/clients/ca.crt
              client_ca_file_reload: true
              min_version: "1.3"
              reload_interval: 1m
      otlp/platform:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14317
            max_recv_msg_size_mib: 1
            tls:
              cert_file: /trust/server/tls.crt
              key_file: /trust/server/tls.key
              client_ca_file: /trust/clients/ca.crt
              client_ca_file_reload: true
              min_version: "1.3"
              reload_interval: 1m
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 64
      batch:
        timeout: 1s
        send_batch_size: 128
        send_batch_max_size: 256
      filter/source:
        error_mode: propagate
        logs:
          log_record:
            - (resource.attributes["deployment.environment.name"] != "dev") or
              resource.attributes["service.name"] == nil or
              resource.attributes["service.name"] == ""
        traces:
          span:
            - (resource.attributes["deployment.environment.name"] != "dev") or
              resource.attributes["service.name"] == nil or
              resource.attributes["service.name"] == ""
        metrics:
          datapoint:
            - (resource.attributes["deployment.environment.name"] != "dev") or
              resource.attributes["service.name"] == nil or
              resource.attributes["service.name"] == ""
      filter/platform:
        error_mode: propagate
        logs:
          log_record:
            - (resource.attributes["puni.cluster"] != "platform-local" and
              resource.attributes["puni.cluster"] != "workers-local") or
              resource.attributes["deployment.environment.name"] != nil
