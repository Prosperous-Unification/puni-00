              - replace_pattern(attributes["msg"],
                "(?i)((password|passwd|secret|token|api[_-]?key)[\"']?\\s*[:=]\\s*[\"']?)[^\\s\"',}]+",
                "$$1[REDACTED]")
      resource/cluster:
        attributes:
          - key: puni.cluster
            value: ${env:PUNI_CLUSTER_ID}
            action: upsert
          - key: host.name
            value: ${env:OTEL_K8S_NODE_NAME}
            action: upsert
      resource/host-namespace:
        attributes:
          - key: k8s.namespace.name
            value: observability
            action: upsert
    exporters:
      otlp:
        endpoint: signal-gateway.observability-dev.svc:4317
        tls: &a1
          ca_file: /trust/upstream/ca.crt
          cert_file: /trust/client/tls.crt
          key_file: /trust/client/tls.key
          server_name_override: signal-gateway.observability-dev.svc
          min_version: "1.3"
          reload_interval: 1m
        timeout: 10s
        sending_queue: &a2
          enabled: true
          storage: file_storage/queue
          sizer: bytes
          queue_size: 16777216
          num_consumers: 2
          block_on_overflow: false
        retry_on_failure: &a3
          enabled: true
          initial_interval: 1s
          max_interval: 5s
          max_elapsed_time: 30s
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: false
        metric_expiration: 2m
      prometheusremotewrite:
        endpoint: https://signal-metrics.observability-dev.svc:8443/api/v1/write
        resource_to_telemetry_conversion:
          enabled: true
        tls:
          ca_file: /trust/metrics/ca.crt
          min_version: "1.3"
        auth:
