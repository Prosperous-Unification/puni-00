apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-metrics-aeaa989f07b246eea01a08390631ff11d16047a930c15b07111eb47d08655d04
  namespace: observability-dev
data:
  dynamic.yaml: >
    http:
      routers:
        write:
          entryPoints:
            - metrics
          rule: Path(`/api/v1/write`) && Method(`POST`)
          middlewares:
            - write
          service: prometheus
          tls: {}
        query:
          entryPoints:
            - metrics
          rule: (Path(`/api/v1/query`) || Path(`/api/v1/query_range`)) && (Method(`GET`)
            || Method(`POST`))
          middlewares:
            - query
          service: prometheus
          tls: {}
      middlewares:
        write:
          basicAuth:
            usersFile: /auth/write/users
            removeHeader: true
        query:
          basicAuth:
            usersFile: /auth/query/users
            removeHeader: true
      services:
        prometheus:
          loadBalancer:
            servers:
              - url: http://kps-prometheus.observability-dev.svc:9090
    tls:
      certificates:
        - certFile: /tls/tls.crt
          keyFile: /tls/tls.key
      options:
        default:
          minVersion: VersionTLS13
