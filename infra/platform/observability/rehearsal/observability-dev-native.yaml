    {"type":"lens","id":"puni-latest-occurrence-per-fingerprint","attributes":{"state":{"datasourceStates":{"formBased":{"layers":{"latest":{"columnOrder":["fingerprint","lastSeen","occurrence","service","occurrences"],"columns":{"fingerprint":{"customLabel":true,"dataType":"string","isBucketed":true,"label":"Fingerprint","operationType":"terms","params":{"missingBucket":false,"orderBy":{"columnId":"lastSeen","type":"column"},"orderDirection":"desc","otherBucket":false,"size":100},"scale":"ordinal","sourceField":"attributes.failure.fingerprint"},"lastSeen":{"customLabel":true,"dataType":"date","isBucketed":false,"label":"Last seen","operationType":"max","params":{"emptyAsNull":true},"scale":"ratio","sourceField":"@timestamp"},"occurrence":{"customLabel":true,"dataType":"string","isBucketed":false,"label":"Latest occurrence","operationType":"last_value","params":{"sortField":"@timestamp"},"scale":"ordinal","sourceField":"attributes.failure.occurrence_id"},"occurrences":{"customLabel":true,"dataType":"number","isBucketed":false,"label":"Occurrences","operationType":"count","params":{"emptyAsNull":true},"scale":"ratio","sourceField":"___records___"},"service":{"customLabel":true,"dataType":"string","isBucketed":false,"label":"Service","operationType":"last_value","params":{"sortField":"@timestamp"},"scale":"ordinal","sourceField":"attributes.service"}},"incompleteColumns":{}}}}},"filters":[],"query":{"language":"kuery","query":"attributes.failure.fingerprint : *"},"visualization":{"columns":[{"columnId":"fingerprint"},{"columnId":"lastSeen"},{"columnId":"occurrence"},{"columnId":"service"},{"columnId":"occurrences"}],"layerId":"latest","layerType":"data"}},"title":"Latest occurrence per fingerprint","visualizationType":"lnsDatatable"},"references":[{"id":"puni-logs-otel","name":"indexpattern-datasource-layer-latest","type":"index-pattern"}],"coreMigrationVersion":"8.8.0","typeMigrationVersion":"10.1.0"}
