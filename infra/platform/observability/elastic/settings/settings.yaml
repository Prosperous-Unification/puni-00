apiVersion: batch/v1
kind: Job
metadata:
  name: elastic-settings
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          image: docker.io/oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
          command:
            - bun
            - /settings/apply.js
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: settings
              mountPath: /settings
              readOnly: true
            - name: failure-fields
              mountPath: /failure-fields
              readOnly: true
            - name: es-ca
              mountPath: /es-ca
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: signal-configuration
        - name: failure-fields
          configMap:
            name: elastic-failure-fields
        - name: es-ca
          secret:
            secretName: elasticsearch-es-http-certs-public
