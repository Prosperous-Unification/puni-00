apiVersion: batch/v1
kind: Job
metadata:
  name: elastic-settings
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          image: docker.elastic.co/elasticsearch/elasticsearch:9.3.8@sha256:f96812864b81e62a9ce7562c4f4bbef1186bb4e8798f814bc6a5f2b84b51b540
          command:
            - sh
            - /settings/apply.sh
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: settings
              mountPath: /settings
              readOnly: true
            - name: failure-fields
              mountPath: /failure-fields
              readOnly: true
            - name: es-ca
              mountPath: /es-ca
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: signal-configuration
        - name: failure-fields
          configMap:
            name: elastic-failure-fields
        - name: es-ca
          secret:
            secretName: elasticsearch-es-http-certs-public
