apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: observability
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: blackbox-exporter }
  template:
    metadata:
      labels: { app.kubernetes.io/name: blackbox-exporter }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        puni.dev/capability-observability: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          args: [--config.file=/config/blackbox.yml]
          ports: [{ name: http, containerPort: 9115 }]
          readinessProbe:
            httpGet: { path: /-/healthy, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          configMap: { name: blackbox-exporter }
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: blackbox-exporter }
  ports: [{ name: http, port: 9115, targetPort: http }]
