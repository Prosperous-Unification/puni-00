apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - telemetry.yaml
  - otlp-ingress.yaml
configMapGenerator:
  - name: signal-configuration
    namespace: observability
    files:
      - collector.yaml
      - gateway.yaml
      - retention.json
      - logs-policy.json
      - logs-template.json
      - traces-policy.json
      - traces-template.json
      - metrics-policy.json
      - metrics-template.json
      - apply.sh
patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/values/kube-state-metrics/prometheus/monitor/metricRelabelings/0/replacement
        value: platform-production
