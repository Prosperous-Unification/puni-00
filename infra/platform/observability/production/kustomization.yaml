apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eck
  - ../elastic/production
  - ../elastic/settings
  - ../kibana
  - ../prometheus
  - ../otel
  - telemetry.yaml
  - otlp-ingress.yaml
patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/values/kube-state-metrics/prometheus/monitor/metricRelabelings/0/replacement
        value: platform-production
