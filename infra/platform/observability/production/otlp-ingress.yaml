# Collectors accept OTLP from pods in this cluster and, through otel-gateway, from nodes on
# the private network (10.1.0.0/16); Prometheus scrapes their metrics port.
# Proof: on k3d on 2026-09-18 the metrics port was open from an unrelated namespace without this
# policy and closed with it; OTLP from that namespace and the workers cluster still arrived.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otlp-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: otel-collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - from:
        - ipBlock: { cidr: 10.1.0.0/16 }
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 13133 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 8888 }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: observability
spec:
  type: NodePort
  # Keeps the workers node address as the source, which otlp-ingress admits by CIDR.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: otel-collector
    component: agent-collector
  ports:
    - { name: otlp, port: 4317, targetPort: 4317, nodePort: 30417, protocol: TCP }
