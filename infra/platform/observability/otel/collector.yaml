apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: observability
spec:
  interval: 30m
  dependsOn:
    - name: elasticsearch
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: ./infra/platform/charts/opentelemetry-collector-0.173.1.tgz
      version: 0.173.1
      sourceRef:
        kind: GitRepository
        name: puni-platform
        namespace: flux-system
  values:
    fullnameOverride: otel-collector
    mode: daemonset
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
      tag: 0.160.0
      digest: sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command:
      name: otelcol-contrib
    # k3s writes /var/log/pods files as root:root 0640. A non-root UID gets no effective
    # capabilities from the container spec, so reading them needs UID 0; every capability
    # except DAC_READ_SEARCH is dropped, escalation is off and the root filesystem is read-only.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL], add: [DAC_READ_SEARCH] }
    tolerations:
      - operator: Exists
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: '1', memory: 320Mi }
    extraEnvs:
      - name: ELASTIC_PASSWORD
        valueFrom:
          secretKeyRef: { name: elasticsearch-es-elastic-user, key: elastic }
      - name: PUNI_ENVIRONMENT
        valueFrom:
          configMapKeyRef: { name: puni-telemetry, key: environment }
    extraVolumes:
      - name: otel-server-tls
        secret: { secretName: otel-server-tls }
      - name: otel-client-trust
        secret: { secretName: otel-client-trust }
      - name: pod-logs
        hostPath: { path: /var/log/pods, type: Directory }
      - name: state
        hostPath: { path: /var/lib/puni-otelcol, type: DirectoryOrCreate }
      - name: es-ca
        secret: { secretName: elasticsearch-es-http-certs-public }
    extraVolumeMounts:
      - { name: otel-server-tls, mountPath: /etc/otel/server, readOnly: true }
      - { name: otel-client-trust, mountPath: /etc/otel/client-trust, readOnly: true }
      - { name: pod-logs, mountPath: /var/log/pods, readOnly: true }
      - { name: state, mountPath: /var/lib/otelcol }
      - { name: es-ca, mountPath: /etc/elastic, readOnly: true }
    # No host ports: producers reach the collector through its Service and, across clusters,
    # the otel-gateway NodePort that otlp-ingress restricts.
    ports:
      otlp-mtls:
        enabled: true
        containerPort: 14317
        servicePort: 14317
        protocol: TCP
        hostPort: 0
      otlp:
        enabled: true
        hostPort: 0
      otlp-http:
        enabled: true
        hostPort: 0
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      metrics:
        enabled: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      metricsEndpoints:
        - port: metrics
    alternateConfig:
      extensions:
        health_check:
          endpoint: ${env:MY_POD_IP}:13133
        file_storage/queue:
          directory: /var/lib/otelcol/queue
          create_directory: true
        file_storage/checkpoints:
          directory: /var/lib/otelcol/checkpoints
          create_directory: true
      receivers:
        filelog:
          include: [/var/log/pods/*/*/*.log]
          # The collector's own output would feed back into itself.
          exclude: [/var/log/pods/observability_otel-collector-*/*/*.log]
          start_at: end
          include_file_path: true
          storage: file_storage/checkpoints
          # A WBS pino line keeps its whole text in `body`; only the closed set of fields named in
          # elastic/settings/failure-fields.json is lifted into attributes, each only when its value
          # has the shape the log schema declares. Anything else stays text in `body` and still ships.
          operators:
            - type: container
              id: container-parser
            - type: json_parser
              id: pino-parser
              if: 'body matches "^\\{"'
              parse_to: attributes.pino
              on_error: send
            # JSON from any other workload is not lifted: its fields are not ours to index.
            # Proof: without this operator, a foreign line's `err.fingerprint` was lifted as
            # `failure.fingerprint: fpX` in the collector harness on 2026-10-11.
            - type: remove
              id: pino-foreign
              if: 'attributes.pino != nil && (type(attributes.pino?.service) != "string" || !(attributes.pino.service in ["be-01", "gw-01", "fe-01", "mcp-01"]))'
              field: attributes.pino
            # Proof: with this condition reduced to `!= nil`, `level: loud` was lifted on 2026-10-11.
            - type: move
              id: pino-level
              if: 'type(attributes.pino?.level) == "string" && attributes.pino.level in ["trace", "debug", "info", "warn", "error", "fatal"]'
              from: attributes.pino.level
              to: attributes.level
            - type: move
              id: pino-msg
              if: 'type(attributes.pino?.msg) == "string"'
              from: attributes.pino.msg
              to: attributes.msg
            - type: move
              id: pino-time
              if: 'type(attributes.pino?.time) in ["int", "float"]'
              from: attributes.pino.time
              to: attributes.time
            - type: move
              id: failure-occurrence-id
              if: 'type(attributes.pino?.err) == "map" && type(attributes.pino.err.occurrence_id) == "string" && attributes.pino.err.occurrence_id matches "^[A-Za-z0-9_.:-]{1,128}$"'
              from: attributes.pino.err.occurrence_id
              to: attributes["failure.occurrence_id"]
            # Proof: without the shape match, `failure.fingerprint: bad fingerprint!` was lifted on
            # 2026-10-11.
            - type: move
              id: failure-fingerprint
              if: 'type(attributes.pino?.err) == "map" && type(attributes.pino.err.fingerprint) == "string" && attributes.pino.err.fingerprint matches "^[A-Za-z0-9_.:-]{1,128}$"'
              from: attributes.pino.err.fingerprint
              to: attributes["failure.fingerprint"]
            - type: move
              id: failure-v
              if: 'type(attributes.pino?.err) == "map" && type(attributes.pino.err.v) == "string" && attributes.pino.err.v matches "^corj/[A-Za-z0-9_.-]{1,32}$"'
              from: attributes.pino.err.v
              to: attributes["failure.v"]
            - type: move
              id: pino-service
              if: 'attributes.pino != nil'
              from: attributes.pino.service
              to: attributes.service
            - type: remove
              id: pino-rest
              if: 'attributes.pino != nil'
              field: attributes.pino
        otlp/mtls:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:14317
              tls:
                cert_file: /etc/otel/server/tls.crt
                key_file: /etc/otel/server/tls.key
                client_ca_file: /etc/otel/client-trust/ca.crt
                # Proof: without this, the live 0.160.0 receiver rejected a newly trusted CA
                # after an overlap update; the fixed run is in otlp-mtls-canary/verify.md.
                client_ca_file_reload: true
                min_version: '1.3'
                reload_interval: 1m
              keepalive:
                server_parameters:
                  max_connection_age: 5m
                  max_connection_age_grace: 30s
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 240
          spike_limit_mib: 60
        # Bodies stay one text field; credential shapes are replaced before export, in the body and
        # in `msg`, the one free-text attribute the filelog operators lift out of it.
        transform/redact:
          log_statements:
            - context: log
              statements:
                - replace_pattern(body, "AGE-SECRET-KEY-1[0-9A-Z]{58}", "[REDACTED]")
                - replace_pattern(body, "gh[pousr]_[A-Za-z0-9]{36,}", "[REDACTED]")
                - replace_pattern(body, "AKIA[0-9A-Z]{16}", "[REDACTED]")
                - replace_pattern(body, "(?i)(authorization:\\s*(bearer|basic)\\s+)[^\\s\"]+", "$$1[REDACTED]")
                - replace_pattern(body, "(?i)((password|passwd|secret|token|api[_-]?key)[\"']?\\s*[:=]\\s*[\"']?)[^\\s\"',}]+", "$$1[REDACTED]")
                # Proof: without the `msg` statements, `password=hunter2` reached `attributes.msg`
                # in the collector harness on 2026-10-11; with them k3d stored `password=[REDACTED]`.
                - replace_pattern(attributes["msg"], "AGE-SECRET-KEY-1[0-9A-Z]{58}", "[REDACTED]")
                - replace_pattern(attributes["msg"], "gh[pousr]_[A-Za-z0-9]{36,}", "[REDACTED]")
                - replace_pattern(attributes["msg"], "AKIA[0-9A-Z]{16}", "[REDACTED]")
                - replace_pattern(attributes["msg"], "(?i)(authorization:\\s*(bearer|basic)\\s+)[^\\s\"]+", "$$1[REDACTED]")
                - replace_pattern(attributes["msg"], "(?i)((password|passwd|secret|token|api[_-]?key)[\"']?\\s*[:=]\\s*[\"']?)[^\\s\"',}]+", "$$1[REDACTED]")
        resource/stream:
          attributes:
            - { key: data_stream.dataset, value: puni, action: upsert }
            - { key: data_stream.namespace, value: '${env:PUNI_ENVIRONMENT}', action: upsert }
        batch:
          send_batch_size: 1000
          timeout: 5s
      exporters:
        prometheusremotewrite:
          endpoint: http://kps-prometheus.observability.svc:9090/api/v1/write
          resource_to_telemetry_conversion:
            enabled: true
        elasticsearch:
          endpoint: https://elasticsearch-es-http.observability.svc:9200
          user: elastic
          password: ${env:ELASTIC_PASSWORD}
          tls:
            ca_file: /etc/elastic/ca.crt
          mapping:
            mode: otel
          sending_queue:
            enabled: true
            storage: file_storage/queue
            queue_size: 5000
            # The exporter's default, stated because the alert rules depend on it: a full queue
            # stops intake instead of dropping, so PuniLogQueueFull, not a drop counter, reports it.
            block_on_overflow: true
          # Consumers keep retrying a refused connection while the persistent queue absorbs the
          # outage (openspec/changes/k3s-fleet/verify.md). A request whose connection hangs instead
          # ends in a timeout the exporter does not retry, and its batch is dropped: a 60 s outage
          # on k3d on 2026-10-11 lost 49 of 900 lines that way
          # (openspec/changes/log-failure-records/verify.md, "Elasticsearch outage").
          retry:
            enabled: true
            max_retries: 100000
            initial_interval: 1s
            max_interval: 30s
            retry_on_status: [429, 502, 503, 504]
      service:
        extensions: [health_check, file_storage/queue, file_storage/checkpoints]
        telemetry:
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: ${env:MY_POD_IP}
                      port: 8888
        pipelines:
          logs:
            receivers: [filelog, otlp, otlp/mtls]
            processors: [memory_limiter, transform/redact, resource/stream, batch]
            exporters: [elasticsearch]
          # Workers clusters ship host metrics here; Prometheus accepts them by remote write.
          metrics:
            receivers: [otlp, otlp/mtls]
            processors: [memory_limiter, batch]
            exporters: [prometheusremotewrite]
