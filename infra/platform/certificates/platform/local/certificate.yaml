apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: otel-server
  namespace: observability
spec:
  ca:
    secretName: otel-server-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-server
  namespace: observability
spec:
  secretName: otel-server-tls
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames: [otel-gateway.puni.internal]
  usages: [digital signature, server auth]
  issuerRef:
    name: otel-server
    kind: Issuer
