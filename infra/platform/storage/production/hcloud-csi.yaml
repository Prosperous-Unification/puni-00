apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-csi
  namespace: kube-system
spec:
  interval: 30m
  dependsOn:
    - name: hcloud-ccm
  chart:
    spec:
      chart: ./infra/platform/charts/hcloud-csi-2.23.0.tgz
      version: 2.23.0
      sourceRef:
        kind: GitRepository
        name: puni-platform
        namespace: flux-system
  values:
    # hcloud-volumes stays the chart's default; every platform claim names puni-retain.
    storageClasses:
      - { name: hcloud-volumes, defaultStorageClass: true, reclaimPolicy: Delete }
      - { name: puni-retain, defaultStorageClass: false, reclaimPolicy: Retain }
    controller:
      image:
        csiAttacher:
          name: registry.k8s.io/sig-storage/csi-attacher:v4.11.0@sha256:b74b05b39501565022883fc128002b4cb857a7bb6c858606bcb3fdedba0b0b80
          tag: ''
        csiResizer:
          name: registry.k8s.io/sig-storage/csi-resizer:v2.1.0@sha256:589e525cddef6d768e68da1f0bc9ffd0a24bf3add3dd010648eb7189976fde79
          tag: ''
        csiProvisioner:
          name: registry.k8s.io/sig-storage/csi-provisioner:v6.2.0@sha256:6be9f63ca4caa6c46aae55aa372500949d8a21473d72f819da1f746076b32d4e
          tag: ''
        livenessProbe:
          name: registry.k8s.io/sig-storage/livenessprobe:v2.18.0@sha256:c4cc074199c045dd73ab85f28897e2a32f4d6f38ffdba4f3b13b8007ccbd3570
          tag: ''
        hcloudCSIDriver:
          name: docker.io/hetznercloud/hcloud-csi-driver:v2.23.0@sha256:024ea4b07161b2f2cb27449be60de8cf942ac80424d1d213696db237cdf7f7f4
          tag: ''
    node:
      image:
        csiNodeDriverRegistrar:
          name: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0@sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70
          tag: ''
        livenessProbe:
          name: registry.k8s.io/sig-storage/livenessprobe:v2.18.0@sha256:c4cc074199c045dd73ab85f28897e2a32f4d6f38ffdba4f3b13b8007ccbd3570
          tag: ''
        hcloudCSIDriver:
          name: docker.io/hetznercloud/hcloud-csi-driver:v2.23.0@sha256:024ea4b07161b2f2cb27449be60de8cf942ac80424d1d213696db237cdf7f7f4
          tag: ''
